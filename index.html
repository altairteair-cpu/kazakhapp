<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kazakh &amp; Russian Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-column phone app, sky-blue + steppe-gold from the Kazakh flag, bottom tab bar. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#10222B; --muted:#576A73; --line:#DAE3E8;
  --sky:#00849B; --sky-soft:#E1F3F6; --gold:#B88300; --gold-soft:#FBF1D6;
  --good:#1D8048; --bad:#B93E2B;
  --display:"PT Serif", Georgia, "Times New Roman", serif;
  --body:"PT Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --on-accent:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B161B; --surface:#13232A; --ink:#E7F0F3; --muted:#93A7B0; --line:#24373F;
    --sky:#3BC3DA; --sky-soft:#12333B; --gold:#F0C23A; --gold-soft:#3A2F10;
    --good:#4CC27F; --bad:#F27B66; --on-accent:#06222A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B161B; --surface:#13232A; --ink:#E7F0F3; --muted:#93A7B0; --line:#24373F;
  --sky:#3BC3DA; --sky-soft:#12333B; --gold:#F0C23A; --gold-soft:#3A2F10;
  --good:#4CC27F; --bad:#F27B66; --on-accent:#06222A; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:3px solid var(--gold);background:var(--surface);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{font-family:var(--display);font-size:22px;margin:0;white-space:nowrap}
header h1 span{color:var(--sky)}
#sync{font-size:12.5px;color:var(--muted);text-align:right}
main{flex:1;padding:18px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-size:21px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:4px 0 0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.hot b{color:var(--gold)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--sky);color:var(--on-accent);min-height:48px}
.btn.ghost{background:transparent;color:var(--sky);border:1.5px solid var(--sky)}
.btn.block{width:100%}
.btn.bad{background:var(--bad);color:var(--on-accent)}
.btn.good{background:var(--good);color:var(--on-accent)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.linkish{background:none;border:0;color:var(--sky);padding:4px 0;cursor:pointer;font-size:14px;text-decoration:underline}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.deck.next{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.deck .t{font-family:var(--display);font-size:19px;font-weight:700}
.deck .t em{font-family:var(--body);font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-left:8px;vertical-align:middle}
.deck .s{font-size:14px;color:var(--muted);grid-column:1}
.deck .acts{grid-row:1 / span 3;grid-column:2;display:flex;flex-direction:column;gap:6px}
.deck .acts button{padding:8px 12px;min-height:38px;font-size:14px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;grid-column:1}
.bar i{display:block;height:100%;background:var(--gold)}
.tip{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.back{align-self:flex-start;background:none;border:0;color:var(--sky);font-weight:700;cursor:pointer;padding:4px 0}
/* flashcard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer;box-shadow:0 6px 24px rgba(0,40,55,.07)}
.card .big{font-family:var(--display);font-size:32px;line-height:1.2;font-weight:700;text-wrap:balance}
.card .hint{font-style:italic;color:var(--sky);font-size:16px}
.card .ru{font-size:20px}
.card .en{font-size:17px;color:var(--muted)}
.card .note{font-size:14.5px;color:var(--ink);background:var(--sky-soft);border-radius:10px;padding:10px 12px;margin-top:6px;text-align:left}
.card .label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.speak{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;min-height:38px}
.speak svg{width:16px;height:16px;fill:var(--sky)}
.speak.on{border-color:var(--bad);color:var(--bad)}
.speak.on svg{fill:var(--bad)}
a{color:var(--sky)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
/* quiz */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;text-align:left}
.chip:disabled{opacity:.55;cursor:default}
.chip[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--sky);font-weight:700}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center}
.q .big{font-family:var(--display);font-size:28px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt small{display:block;color:var(--muted);font-size:13.5px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
/* letters */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.letter .L{font-family:var(--display);font-size:36px;font-weight:700;color:var(--sky);line-height:1}
.letter p{font-size:14.5px}
.letter .ex{font-size:14px;color:var(--muted)}
/* russian */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:19px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding-top:10px;border-top:1px solid var(--line);align-items:center}
.item .w{font-family:var(--display);font-size:21px;font-weight:700}
.item .snd{color:var(--sky);font-size:15px}
.item .m{font-size:14px;color:var(--muted);grid-column:1}
.item .b{grid-row:1 / span 3;grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.item .heard{grid-column:1 / -1;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--sky-soft)}
.heard.ok{background:color-mix(in srgb,var(--good) 14%,var(--surface))}
/* menu */
.menu{display:flex;flex-direction:column;gap:10px}
.menu button{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.menu button b{font-family:var(--display);font-size:19px;color:var(--sky);text-align:center}
.menu button span{display:flex;flex-direction:column}
.menu button small{color:var(--muted);font-size:14px}
/* grammar */
.lesson h2{font-size:20px}
.lesson table{border-collapse:collapse;width:100%;font-size:15px}
.lesson td,.lesson th{border-bottom:1px solid var(--line);padding:6px 8px 6px 0;text-align:left;vertical-align:top}
.lesson th{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl{overflow-x:auto}
.kk{font-family:var(--display);font-weight:700}
.ex-q{font-size:17px}
.ex-q b{color:var(--sky)}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;border-radius:16px;padding:11px 14px;display:flex;flex-direction:column;gap:6px}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--sky);color:var(--on-accent);border-bottom-right-radius:4px}
.bub .tgt{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.3}
.bub .pr{font-style:italic;color:var(--sky);font-size:14.5px}
.bub .tr{font-size:15px;color:var(--muted)}
.fix{align-self:flex-end;max-width:88%;font-size:14.5px;border-radius:12px;padding:9px 12px;background:var(--gold-soft);border-left:4px solid var(--gold)}
.fix.ok{background:color-mix(in srgb,var(--good) 12%,var(--surface));border-left-color:var(--good)}
.fix b{font-family:var(--display)}
.typing{align-self:flex-start;color:var(--muted);font-style:italic;font-size:15px}
.compose{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.compose .in{display:flex;gap:8px;align-items:flex-end}
textarea,input[type=text],select{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:17px}
textarea{resize:none;min-height:48px;max-height:140px}
.kb{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.kb button{flex:0 0 auto;min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:19px;font-weight:700;cursor:pointer}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg .chip small{display:block;color:var(--muted);font-weight:400}
label{font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:5px}
.word{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.word .kk{font-size:19px}
.word small{color:var(--muted);grid-column:1}
.word .b{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px}
.err{color:var(--bad);font-size:14.5px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:10px 2px 9px;font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
nav button b{font-family:var(--display);font-size:19px;line-height:1}
nav button[aria-current="page"]{color:var(--sky);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.tile b{font-size:24px}.card .big{font-size:28px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Қазақша <span>+</span> Русский</h1>
    <div id="sync">Saved on this device</div>
  </header>
  <main id="view"></main>
</div>
<nav aria-label="Sections"><div class="in">
  <button data-tab="home"><b>Үй</b>Home</button>
  <button data-tab="learn"><b>Сөз</b>Cards</button>
  <button data-tab="talk"><b>Сөйле</b>Talk</button>
  <button data-tab="quiz"><b>Тест</b>Quiz</button>
  <button data-tab="more"><b>Тағы</b>More</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= CONTENT =================

   Hint key: ä = a in "cat", ö/ü = German ö/ü, q = k from deep in the throat,
   ğ = gargled g, ñ = ng, ı = short Russian ы, j = zh/j, w = short u glide, x = Russian х
*/
const DECKS = [
 {id:"greet", title:"Сәлем", sub:"Greetings and politeness", start:true, cards:[

  {kk:"Сәлем!", ru:"Привет!", en:"Hi", hint:"sälem", note:"For friends and cousins your age."},
  {kk:"Ассалаумағалейкум!", ru:"Ассаламу алейкум!", en:"Peace be upon you (traditional greeting)", hint:"assalawmağaleykum", note:"Common between men, especially toward elders, often with a two-handed handshake. The reply is «Уағалейкумассалам»."},
  {kk:"Қалайсыз?", ru:"Как вы?", en:"How are you? (polite)", hint:"qalaysız"},

  {kk:"Жақсы, рақмет.", ru:"Хорошо, спасибо.", en:"Good, thanks.", hint:"jaqsı, raqmet", note:"You'll also see it spelled «рахмет»."},
  {kk:"Өзіңіз қалайсыз?", ru:"А вы как?", en:"And how are you?", hint:"öziñiz qalaysız"},
  {kk:"Рақмет!", ru:"Спасибо!", en:"Thank you!", hint:"raqmet"},
  {kk:"Кешіріңіз", ru:"Извините", en:"Excuse me / Sorry", hint:"keshiriñiz"},
  {kk:"Иә / Жоқ", ru:"Да / Нет", en:"Yes / No", hint:"iyä / joq"},
  {kk:"Жарайды", ru:"Ладно, хорошо", en:"OK, alright", hint:"jaraydı"},
  {kk:"Сау болыңыз!", ru:"До свидания!", en:"Goodbye (polite)", hint:"saw bolıñız", note:"Casual version: «Сау бол!»"},
  {kk:"Көріскенше!", ru:"До встречи!", en:"See you!", hint:"köriskenshe"},
  {kk:"Қайырлы таң!", ru:"Доброе утро!", en:"Good morning!", hint:"qayırlı tañ"},
  {kk:"Қайырлы түн!", ru:"Спокойной ночи!", en:"Good night!", hint:"qayırlı tün"}
 ]},
 {id:"survive", title:"Құтқар!", sub:"When you're stuck in a conversation", start:true, cards:[
  {kk:"Мен қазақ тілін үйреніп жүрмін.", ru:"Я учу казахский язык.", en:"I'm learning Kazakh.", hint:"men qazaq tilin üyrenip jürmin", note:"Say this early. People respond far better to someone trying than to someone silent."},
  {kk:"Қазақша аздап білемін.", ru:"Я немного знаю казахский.", en:"I know a little Kazakh.", hint:"qazaqsha azdap bilemin"},
  {kk:"Мен шетелде өстім.", ru:"Я вырос за границей.", en:"I grew up abroad.", hint:"men shetelde östim"},
  {kk:"Түсінбедім.", ru:"Я не понял.", en:"I didn't understand.", hint:"tüsinbedim"},
  {kk:"Түсіндім.", ru:"Понял.", en:"Got it.", hint:"tüsindim"},
  {kk:"Қайталаңызшы.", ru:"Повторите, пожалуйста.", en:"Please say that again.", hint:"qaytalañızshı"},
  {kk:"Баяуырақ сөйлеңізші.", ru:"Говорите помедленнее, пожалуйста.", en:"Please speak more slowly.", hint:"bayawıraq söyleñizshi"},
  {kk:"Бұл қазақша қалай болады?", ru:"Как это по-казахски?", en:"How do you say this in Kazakh?", hint:"bul qazaqsha qalay boladı", note:"Point at anything and ask. It turns every visit into a lesson."},
  {kk:"Білмеймін.", ru:"Не знаю.", en:"I don't know.", hint:"bilmeymin"},
  {kk:"Менің атым …", ru:"Меня зовут …", en:"My name is …", hint:"meniñ atım …"},
  {kk:"Сіздің атыңыз кім?", ru:"Как вас зовут?", en:"What's your name? (polite)", hint:"sizdiñ atıñız kim"},
  {kk:"Танысқаныма қуаныштымын.", ru:"Приятно познакомиться.", en:"Nice to meet you.", hint:"tanısqanıma quanıshtımın"}
 ]},
 {id:"family", title:"Отбасы", sub:"Family: who's who at the gathering", cards:[
  {kk:"Отбасы", ru:"Семья", en:"Family", hint:"otbası"},
  {kk:"Туыс", ru:"Родственник", en:"Relative", hint:"tuwıs"},
  {kk:"Әке", ru:"Отец", en:"Father", hint:"äke", note:"«Әкем» = my father. Add -м / -ым / -ім for \"my\"."},
  {kk:"Ана", ru:"Мать", en:"Mother", hint:"ana", note:"At home many families say «мама» or «апа»."},

  {kk:"Іні", ru:"Младший брат", en:"Younger brother", hint:"ini"},
  {kk:"Қарындас", ru:"Младшая сестра (у мужчины)", en:"Younger sister (a man's)", hint:"qarındas", note:"You're a man, so this is your word. A woman says «сіңлі» for her younger sister."},
  {kk:"Бауырым", ru:"Братишка, родной", en:"My dear brother / kin", hint:"bawırım", note:"A warm way to address relatives and close friends."},

  {kk:"Ұл / Қыз", ru:"Сын / Дочь, девушка", en:"Son / Daughter, girl", hint:"ul / qız"}
 ]},
 {id:"table", title:"Дастархан", sub:"At the table", cards:[
  {kk:"Дастархан", ru:"Накрытый стол", en:"The laid table, the feast", hint:"dastarxan"},
  {kk:"Ас болсын!", ru:"Приятного аппетита!", en:"Enjoy your meal!", hint:"as bolsın", note:"Say it to people who are eating, including when you walk in on a meal."},
  {kk:"Шай ішесіз бе?", ru:"Будете чай?", en:"Will you have tea?", hint:"shay ishesiz be", note:"Tea is poured a little at a time and refilled often. Accepting is polite."},
  {kk:"Иә, рақмет.", ru:"Да, спасибо.", en:"Yes, thank you.", hint:"iyä, raqmet"},
  {kk:"Дәмді екен!", ru:"Как вкусно!", en:"This is delicious!", hint:"dämdi eken", note:"The single best phrase for making a grandmother happy."},

  {w:"сестра́", s:"[систра́]", m:"sister"},

const LESSONS = [
 {id:"order", title:"1. Word order: the verb goes last", body:`
  <p>Kazakh puts the verb at the end of the sentence. Think "I tea drink", not "I drink tea".</p>
  <div class="tbl"><table><tr><th>Kazakh</th><th>Word by word</th><th>Meaning</th></tr>
  <tr><td class="kk">Мен шай ішемін.</td><td>I tea drink</td><td>I drink tea.</td></tr>
  <tr><td class="kk">Әжем ауылда тұрады.</td><td>my-grandma village-in lives</td><td>My grandma lives in the village.</td></tr>
  <tr><td class="kk">Мен қазақ тілін үйреніп жүрмін.</td><td>I Kazakh language learning am</td><td>I'm learning Kazakh.</td></tr></table></div>
  <p>Endings do the work that prepositions do in Russian and English: <span class="kk">ауыл-да</span> = in the village.</p>`,
  ex:[]},
 {id:"verbs", title:"2. Verb endings: who is doing it", body:`
  <p>The present/future tense is <b>verb stem + а/е/й + person ending</b>. The ending tells you who, so <span class="kk">мен</span> is often dropped.</p>
  <div class="tbl"><table><tr><th>Person</th><th>бару (to go)</th><th>білу (to know)</th></tr>
  <tr><td>Мен (I)</td><td class="kk">барамын</td><td class="kk">білемін</td></tr>
  <tr><td>Сен (you, casual)</td><td class="kk">барасың</td><td class="kk">білесің</td></tr>
  <tr><td>Сіз (you, polite)</td><td class="kk">барасыз</td><td class="kk">білесіз</td></tr>
  <tr><td>Ол (he/she)</td><td class="kk">барады</td><td class="kk">біледі</td></tr>
  <tr><td>Біз (we)</td><td class="kk">барамыз</td><td class="kk">білеміз</td></tr>
  <tr><td>Олар (they)</td><td class="kk">барады</td><td class="kk">біледі</td></tr></table></div>
  <p><b>Not:</b> add <span class="kk">-ма/-ме/-ба/-бе/-па/-пе</span> to the stem: <span class="kk">бармаймын</span> (I won't go), <span class="kk">білмеймін</span> (I don't know).</p>`,
  ex:[
   {q:"Мен шай іше__. (I drink tea)", o:["мін","сіз","ді"], a:0},
   {q:"Сіз қазақша сөйлей__ бе? (Do you speak Kazakh?)", o:["мін","сіз","ді"], a:1},
   {q:"Әжем ауылда тұра__. (Grandma lives in the village)", o:["мын","ды","сыз"], a:1},

  <p>"My" and "your" are endings on the noun. <span class="kk">Менің</span> (my) and <span class="kk">сіздің</span> (your) are optional, for emphasis.</p>

  <p>Back-vowel words (а о ұ ы) take <b>ы</b>; front-vowel words (ә ө ү е і) take <b>і</b>. That's vowel harmony.</p>`,

  <div class="tbl"><table><tr><th>Meaning</th><th>Ending</th><th>Examples</th></tr>

  <p>Pick the version in two steps. <b>Vowel:</b> back-vowel word → а; front-vowel word → е. <b>Consonant:</b> after к қ п с т ш use the voiceless ones (қ/к, т); "from" uses н after м н ң.</p>

const KK_LETTERS = ["ә","ғ","қ","ң","ө","ұ","ү","һ","і"];

/* ================= STATE ================= */
const KEY = "kz-ru-trainer-v1";
const DEFAULTS = () => ({cards:{}, streak:0, lastDay:null, best:{}, mine:[], settings:{newPer:8, hints:true, explain:"ru"}, today:{day:null, n:0}, updatedAt:0});
function normalize(s){
  const d = DEFAULTS();
  s = Object.assign(d, s || {});
  s.settings = Object.assign(DEFAULTS().settings, s.settings || {});
  if(!Array.isArray(s.mine)) s.mine = [];
  if(!s.today) s.today = {day:null, n:0};
  return s;
}
let state = DEFAULTS();
try{ const s = localStorage.getItem(KEY); if(s) state = normalize(JSON.parse(s)); }catch(e){}
const INTERVALS = [0,1,2,4,8,16,32,64];

DECKS.forEach(d => d.cards.forEach((c,i) => { c.id = d.id + ":" + i; c.deck = d.id; }));
function mineDeck(){ return {id:"mine", title:"Менің сөздерім", sub:"Words you added", cards: state.mine}; }
function decks(){ return state.mine.length ? DECKS.concat([mineDeck()]) : DECKS; }
function cards(){ return decks().flatMap(d => d.cards); }
function deckById(id){ return decks().find(d => d.id === id); }

const day = (n=0) => { const d = new Date(); d.setDate(d.getDate()+n); return d.toLocaleDateString("en-CA"); };
let dbRef = null, saveTimer = null;
function save(){
  state.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 1200);
}
async function pushRemote(){
  if(!dbRef) return;
  try{ await dbRef.set(JSON.parse(JSON.stringify(state))); setSync("Synced"); }
  catch(e){ setSync("Saved on this device"); }
}
function setSync(t){ document.getElementById("sync").textContent = t; }

/* ================= CAPABILITIES ================= */
let claudeTTS = null, dict = null, dictHandler = null, dictDenied = false;
let sampleFn = null, sampleState = "loading";
function capUse(name){
  if(!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
  try{ return Promise.resolve(window.claude.use(name)).catch(() => null); }catch(e){ return Promise.resolve(null); }
}
capUse("tts").then(t => { claudeTTS = t; });
capUse("dictation").then(d => {
  if(!d) return;
  dict = d;
  try{
    d.onPartial(({text}) => dictHandler && dictHandler.partial && dictHandler.partial(text));
    d.onFinal(({text}) => dictHandler && dictHandler.final && dictHandler.final(text));
    d.onState(({state:s}) => dictHandler && dictHandler.state && dictHandler.state(s));
  }catch(e){ dict = null; }
  if(tab === "talk" || (tab === "more" && sub === "accent")) render();
});
capUse("sample").then(s => {
  sampleFn = s; sampleState = s ? "ready" : "none";
  if(tab === "talk" || (tab === "more" && sub === "mine")) render();
});
setTimeout(() => { if(sampleState === "loading"){ sampleState = "none"; if(tab === "talk") render(); } }, 11000);

function startDictation(handler){
  if(!dict || dictDenied) return false;
  dictHandler = handler;
  let p;
  try{ p = dict.start(); }catch(e){ handler.state && handler.state("idle"); return false; }
  Promise.resolve(p).catch(e => {
    handler.state && handler.state("idle");
    if(e && e.code === "not_granted"){ dictDenied = true; toast("Microphone is off for this page. You can keep typing."); render(); }
  });
  return true;
}
function stopDictation(){ if(dict){ try{ Promise.resolve(dict.stop()).catch(()=>{}); }catch(e){} } }

async function askJSON(input, opts){
  if(!sampleFn) throw {code:"unavailable"};
  opts = Object.assign({modelTier:"default", cache:false}, opts || {});
  if(typeof sampleFn.json === "function"){
    try{
      const v = await sampleFn.json(input, opts);
      if(v && typeof v === "object") return v;
      if(typeof v === "string") return parseJSON(v);
    }catch(e){
      if(e && (e.code === "not_granted" || e.code === "rate_limited")) throw e;
    }
  }
  const r = await sampleFn(input, opts);
  return parseJSON(r && r.text != null ? r.text : String(r));
}
function parseJSON(t){
  const m = String(t).match(/\{[\s\S]*\}/);
  if(!m) throw {code:"bad_json"};
  return JSON.parse(m[0]);
}
function aiError(e){
  if(e && e.code === "not_granted"){ sampleState = "none"; return "The AI partner is switched off for this page. You can turn it back on from the page's permission settings in Claude."; }
  if(e && e.code === "rate_limited") return "Too many messages in a short time. Wait a minute, then tap Retry.";
  if(e && e.code === "unavailable") return "The AI partner only works when this page is open inside Claude.";
  return "Something went wrong getting a reply. Tap Retry.";
}

/* ================= AUDIO ================= */
function findVoice(lang){
  if(!("speechSynthesis" in window)) return null;
  try{ return speechSynthesis.getVoices().find(v => (v.lang||"").toLowerCase().replace("_","-").startsWith(lang)) || null; }catch(e){ return null; }
}
try{ if("speechSynthesis" in window) speechSynthesis.getVoices(); }catch(e){}
function clean(t){ return String(t).replace(/́/g,"").replace(/…/g,"").replace(/ \/ /g,". "); }
function say(text, lang, slow){
  text = clean(text);
  const v = findVoice(lang);
  if(v){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = v; u.lang = v.lang; u.rate = slow ? 0.6 : 0.9;
      speechSynthesis.speak(u); return;
    }catch(e){}
  }
  if(claudeTTS){
    claudeTTS.speak(text, {language: lang, rate: slow ? 0.7 : 1}).catch(() => noVoice(lang));
    return;
  }
  noVoice(lang);
}
function noVoice(lang){
  toast(lang === "kk"
    ? "This device has no Kazakh voice. Tap \"Hear it on Google Translate\" instead."
    : "This device has no Russian voice. Add one in your phone's text-to-speech settings.");
}
const gt = kk => "https://translate.google.com/?sl=kk&tl=ru&op=translate&text=" + encodeURIComponent(clean(kk));
const ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const MIC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>';

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
let toastT;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 3400); }
const learned = c => (state.cards[c.id]?.box || 0) >= 3;
const isDue = c => state.cards[c.id] && state.cards[c.id].due <= day();
function bumpStreak(){
  const t = day();
  if(state.today.day !== t) state.today = {day:t, n:0};
  state.today.n++;
  if(state.lastDay === t) return;
  state.streak = (state.lastDay === day(-1)) ? (state.streak||0) + 1 : 1;
  state.lastDay = t;
}
const normText = s => clean(s).toLowerCase().replace(/ё/g,"е").replace(/[.,!?;:«»"()\-–—…\/]/g," ").replace(/\s+/g," ").trim();
function kbStrip(targetId){
  return `<div class="kb" role="group" aria-label="Kazakh letters">${KK_LETTERS.map(l => `<button type="button" data-ins="${l}" data-for="${targetId}" aria-label="Insert ${l}">${l}</button>`).join("")}</div>`;
}
function wireKb(){
  $$("[data-ins]").forEach(b => {
    b.onpointerdown = e => e.preventDefault();       // keep focus in the text box
    b.onclick = () => {
      const el = document.getElementById(b.dataset.for); if(!el) return;
      const s = el.selectionStart ?? el.value.length, e2 = el.selectionEnd ?? el.value.length;
      el.setRangeText(b.dataset.ins, s, e2, "end");
      el.dispatchEvent(new Event("input", {bubbles:true}));
      el.focus();
    };
  });
}
function addMine(w){
  if(!w || !w.kk) return false;
  if(cards().some(c => normText(c.kk) === normText(w.kk))) { toast("Already in your cards: " + w.kk); return false; }
  state.mine.push({id:"mine:" + Date.now().toString(36) + Math.random().toString(36).slice(2,5), deck:"mine", kk:w.kk.trim(), ru:(w.ru||"").trim(), en:(w.en||"").trim(), hint:(w.hint||"").trim(), note:(w.note||"").trim()});
  save(); toast("Added to My words: " + w.kk);
  return true;
}

/* ================= NAV ================= */
let tab = "home", sub = null;
function go(t, s){
  if(dictHandler) { stopDictation(); dictHandler = null; }
  tab = t; sub = s || null;
  $$("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === t ? "page" : "false"));

}

/* ================= HOME ================= */
function home(){
  const all = cards();
  const due = all.filter(isDue).length;
  const fresh = all.filter(c => !state.cards[c.id]).length;
  const streak = (state.lastDay === day() || state.lastDay === day(-1)) ? state.streak : 0;
  const total = all.filter(learned).length;
  const todayN = state.today.day === day() ? state.today.n : 0;
  const nextDeck = decks().find(d => d.cards.some(c => !learned(c)));
  $("#view").innerHTML = `
   <div class="tiles">
     <div class="tile hot"><b>${streak}</b><span>day streak</span></div>
     <div class="tile"><b>${due}</b><span>cards due</span></div>
     <div class="tile"><b>${total}<small class="muted" style="font-size:15px">/${all.length}</small></b><span>words learned</span></div>
   </div>
   <button class="btn block" id="start">${due ? `Review ${due} due card${due>1?"s":""}` : "Start today's session"}${fresh && !due ? ` · ${Math.min(state.settings.newPer,fresh)} new` : ""}</button>
   ${todayN ? `<p class="small muted">Today: ${todayN} card${todayN>1?"s":""} practised.</p>` : ""}
   <button class="btn ghost block" id="talkgo">Talk with an AI partner in Kazakh or Russian</button>
   <h3>Decks</h3>
   <div class="stack">${decks().map(d => {
     const n = d.cards.filter(learned).length;
     const isNext = nextDeck && d.id === nextDeck.id;
     return `<div class="deck${isNext ? " next" : ""}">
       <div class="t">${esc(d.title)}${isNext ? "<em>Up next</em>" : d.start ? "<em>Start here</em>" : ""}</div>
       <div class="acts"><button class="btn" data-study="${d.id}">Study</button><button class="btn ghost" data-quiz="${d.id}">Quiz</button></div>
       <div class="s">${esc(d.sub)} · ${n}/${d.cards.length} learned</div>
       <div class="bar"><i style="width:${d.cards.length ? Math.round(100*n/d.cards.length) : 0}%"></i></div>
     </div>`; }).join("")}
   </div>
   <p class="small muted">Tap "Knew it" and a card waits 1, 2, 4, 8 days and longer before it comes back. Miss it and you'll see it again today. Once you know a card well, it flips: you see the Russian and say the Kazakh.</p>`;
  $("#start").onclick = () => startSession(null);
  $("#talkgo").onclick = () => go("talk");
  $$("[data-study]").forEach(b => b.onclick = () => startSession(b.dataset.study));
  $$("[data-quiz]").forEach(b => b.onclick = () => { quizDeck = b.dataset.quiz; quizRun = null; buildRun = null; go("quiz"); });
}

/* ================= CARDS ================= */
let session = null;
function startSession(deckId){
  const pool = deckId ? (deckById(deckId)?.cards || []) : cards();
  const due = shuffle(pool.filter(isDue));
  const fresh = pool.filter(c => !state.cards[c.id]).slice(0, state.settings.newPer);
  let queue = due.concat(fresh);
  if(!queue.length){
    queue = shuffle(pool).sort((a,b) => (state.cards[a.id]?.box||0) - (state.cards[b.id]?.box||0)).slice(0, 10);
  }
  session = {deckId, queue, i:0, flipped:false, again:{}, right:0, total:queue.length};
  go("learn");
}
function learn(){
  if(!session){
    $("#view").innerHTML = `<h2>Cards</h2><p class="muted">Pick what to study.</p>
     <button class="btn block" id="s-all">Today's mixed session</button>
     <div class="stack">${decks().map(d => `<button class="btn ghost block" data-study="${d.id}">${esc(d.title)} · ${esc(d.sub)}</button>`).join("")}</div>`;
    $("#s-all").onclick = () => startSession(null);
    $$("[data-study]").forEach(b => b.onclick = () => startSession(b.dataset.study));
    return;
  }
  if(!session.queue.length){
    $("#view").innerHTML = `<h2>No cards here yet</h2><p class="muted">Add words in More → My words, or pick another deck.</p><button class="btn block" id="home">Back to home</button>`;
    $("#home").onclick = () => { session = null; go("home"); };
    return;
  }
  if(session.i >= session.queue.length){
    $("#view").innerHTML = `<h2>Керемет! Session done.</h2>
     <p>You knew <b>${session.right}</b> of ${session.total} cards on the first try.</p>
     <div class="tip">Now use them: a two-minute chat with the AI partner fixes words in memory far better than another round of cards.</div>
     <button class="btn block" id="talk">Practise in a conversation</button>
     <button class="btn ghost block" id="again">Another round of cards</button>
     <button class="linkish" id="home">Back to home</button>`;
    $("#talk").onclick = () => { session = null; go("talk"); };
    $("#again").onclick = () => startSession(session.deckId);
    $("#home").onclick = () => { session = null; go("home"); };
    return;
  }
  const c = session.queue[session.i];
  const box = state.cards[c.id]?.box || 0;
  const reverse = box >= 2;
  const isNew = !state.cards[c.id];
  const front = reverse
    ? `<div class="label">Say it in Kazakh</div><div class="big" style="font-size:26px">${esc(c.ru || c.en)}</div><div class="en">${esc(c.ru ? c.en : "")}</div>`
    : `<div class="label">${isNew ? "New card" : "What does this mean?"}</div><div class="big">${esc(c.kk)}</div>`;
  const back = `<div class="big">${esc(c.kk)}</div>
     ${state.settings.hints && c.hint ? `<div class="hint">${esc(c.hint)}</div>` : ""}
     ${c.ru ? `<div class="ru">${esc(c.ru)}</div>` : ""}
     ${c.en ? `<div class="en">${esc(c.en)}</div>` : ""}
     ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}`;
  const dname = session.deckId ? (deckById(session.deckId)?.title || "") : "Mixed session";
  $("#view").innerHTML = `
   <div class="progress"><span>${esc(dname)}</span><span>${session.i+1} / ${session.queue.length}</span></div>
   <div class="card" id="card" role="button" tabindex="0" aria-label="Flip card">${session.flipped ? back : front}
     ${session.flipped ? "" : `<div class="small muted" style="margin-top:14px">Tap to see the answer</div>`}
   </div>
   <div class="row" style="justify-content:center">
     <button class="speak" id="play">${ICON}Listen</button>
     <button class="speak" id="slow">${ICON}Slowly</button>
     <a class="small" href="${gt(c.kk)}" target="_blank" rel="noopener">Hear it on Google Translate</a>
   </div>
   ${session.flipped
     ? `<div class="grade"><button class="btn bad" id="no">Didn't know</button><button class="btn good" id="yes">Knew it</button></div>`
     : `<button class="btn block" id="flip">Show answer</button>`}
   <button class="linkish" id="quit">End session</button>`;
  const flip = () => { session.flipped = true; learn(); };
  $("#card").onclick = () => { if(!session.flipped) flip(); };
  $("#card").onkeydown = e => { if((e.key==="Enter"||e.key===" ") && !session.flipped){ e.preventDefault(); flip(); } };
  $("#play").onclick = () => say(c.kk, "kk", false);
  $("#slow").onclick = () => say(c.kk, "kk", true);
  $("#quit").onclick = () => { session.i = session.queue.length; learn(); };
  if(!session.flipped){ $("#flip").onclick = flip; return; }
  $("#yes").onclick = () => grade(c, true);
  $("#no").onclick = () => grade(c, false);
}
function grade(c, ok){
  const prev = state.cards[c.id] || {box:0};
  const firstTry = !session.again[c.id];
  if(ok){
    const box = firstTry ? Math.min(prev.box + 1, INTERVALS.length-1) : Math.max(prev.box, 1);
    state.cards[c.id] = {box, due: day(INTERVALS[box])};
    if(firstTry) session.right++;
  }else{
    state.cards[c.id] = {box:0, due: day()};
    if((session.again[c.id]||0) < 2){ session.again[c.id] = (session.again[c.id]||0) + 1; session.queue.push(c); }
  }
  bumpStreak(); save();
  session.i++; session.flipped = false; learn();
}

/* ================= TALK (AI partner) ================= */
let talkS = null;   // {scene, msgs, turns, busy, err, draft}
function knownWords(){
  return cards().filter(c => state.cards[c.id]).map(c => c.kk.replace(/[!?.]/g,"")).slice(0, 80).join(", ");
}
function scenePrompt(sc){
  const kk = sc.lang === "kk";
  const explain = state.settings.explain === "en" ? "English" : "Russian";
  return [
   `You are a conversation partner in a language-learning app. The learner is a 19-year-old Kazakh man who grew up abroad. His Kazakh is beginner level (he knows numbers and some phrases). His Russian is about B2 with a strong American accent. He is practising ${kk ? "KAZAKH" : "RUSSIAN"}.`,
   `Scene: ${sc.setup}`,
   `You play: ${sc.role}. Stay in character and keep the scene moving with a question or a prompt he can answer.`,
   kk
    ? `Write your reply in Kazakh (Cyrillic) only: 1–2 short, simple sentences, beginner level, everyday spoken Kazakh. Prefer words he has studied: ${knownWords() || "basic greetings"}.`
    : `Write your reply in natural spoken Russian, 1–3 sentences, B1–B2 level. Put a stress mark (combining acute accent U+0301) after the stressed vowel of every word with two or more syllables, e.g. «хорошо́», «спаси́бо».`,
   `He may write in ${kk ? "Kazakh, Russian or English. If he writes in Russian or English, put the Kazakh way to say it in correction.fixed" : "Russian or English. If he writes in English, put the Russian way to say it in correction.fixed"}. Check his last message for real mistakes (grammar, endings, word choice, ${kk ? "Kazakh letters ә ғ қ ң ө ұ ү һ і, Сіз vs сен with elders" : "cases, aspect, gender"}). Ignore punctuation and capital letters. Be warm and brief.`,
   `Respond with ONLY a JSON object, no markdown, in exactly this shape:`,
   `{"correction":{"ok":true,"fixed":"","explain":""},"reply":"","pron":"","ru":"","en":"","suggestions":[{"text":"","en":""}],"new_words":[{"kk":"","ru":"","en":""}]}`,
   `- correction.ok: true if his message was correct or there is no message yet. Otherwise false, with fixed = the corrected ${kk ? "Kazakh" : "Russian"} sentence and explain = one short sentence in ${explain} saying what changed.`,
   kk ? `- pron: Latin-letter pronunciation of your reply (ä ö ü ı q ğ ñ for the Kazakh sounds).` : `- pron: empty string.`,
   kk ? `- ru: Russian translation of your reply. en: English translation.` : `- ru: empty string. en: English translation of your reply.`,
   `- suggestions: exactly 3 short, simple answers he could give next, in ${kk ? "Kazakh" : "Russian"}${kk ? "" : " with stress marks"}, each with its English meaning.`,
   kk ? `- new_words: up to 3 useful words or phrases from your reply that a beginner may not know (kk, ru, en). Empty array if none.` : `- new_words: empty array.`
  ].join("\n");
}
function startScene(sc){
  talkS = {scene:sc, msgs:[{role:"user", content: scenePrompt(sc) + "\n\nThere is no message from him yet. Start the scene with your first line."}], turns:[], busy:false, err:null, draft:""};
  render();
  requestReply();
}
async function requestReply(){
  const t = talkS; if(!t) return;
  t.busy = true; t.err = null; render();
  try{
    const res = await askJSON(t.msgs.slice(0,1).concat(t.msgs.slice(1).slice(-18)));
    if(talkS !== t) return;
    if(!res || typeof res.reply !== "string" || !res.reply.trim()) throw {code:"bad_json"};
    const lastMe = [...t.turns].reverse().find(x => x.who === "me");
    if(lastMe && !lastMe.correction && res.correction) lastMe.correction = res.correction;
    t.msgs.push({role:"assistant", content: JSON.stringify(res)});
    t.turns.push({who:"ai", data:res, show:false});
  }catch(e){
    if(talkS !== t) return;
    t.err = aiError(e);
  }
  t.busy = false; render();
  setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30);
}
function sendTalk(text){
  const t = talkS; text = (text||"").trim();
  if(!t || !text || t.busy) return;
  t.turns.push({who:"me", text});
  t.msgs.push({role:"user", content: `His message: «${text}»\nRespond with the JSON object only.`});
  t.draft = "";
  bumpStreak(); save();
  requestReply();
}
function talk(){
  if(!talkS){
    const avail = sampleState === "ready";
    const scene = sc => `<button class="chip" data-scene="${sc.id}" ${avail ? "" : "disabled"}><b>${esc(sc.title)}</b><small>${esc(sc.sub)}</small></button>`;
    $("#view").innerHTML = `<h2>Talk</h2>
     <p class="muted">Pick a scene. Your partner answers in simple Kazakh or Russian, fixes your mistakes, and suggests what you could say next. Stuck? Write in Russian or English and it will show you how to say it.</p>
     ${sampleState === "loading" ? `<p class="small muted">Connecting to the AI partner…</p>` : ""}
     ${sampleState === "none" ? `<div class="tip">The AI partner works when this page is open inside Claude while you're signed in. Everything else in the app works without it.</div>` : ""}
     <h3>Kazakh</h3><div class="sugg">${SCENES.filter(s => s.lang==="kk").map(scene).join("")}</div>
     <h3>Russian</h3><div class="sugg">${SCENES.filter(s => s.lang==="ru").map(scene).join("")}</div>
     <p class="small muted">Uses your Claude plan's normal usage. No API key or separate bill.</p>`;
    $$("[data-scene]").forEach(b => b.onclick = () => startScene(SCENES.find(s => s.id === b.dataset.scene)));

  }
  const t = talkS, sc = t.scene, kk = sc.lang === "kk";
  const lastAi = [...t.turns].reverse().find(x => x.who === "ai");
  const html = t.turns.map((x, i) => {
    if(x.who === "me"){
      const c = x.correction;
      const fix = !c ? "" : c.ok
        ? `<div class="fix ok">Correct.</div>`
        : `<div class="fix">Better: <b>${esc(c.fixed)}</b>${c.explain ? `<br>${esc(c.explain)}` : ""}${kk && c.fixed ? `<br><button class="linkish" data-savefix="${i}">${x.saved ? "Saved to My words" : "+ Save as a card"}</button>` : ""}</div>`;
      return `<div class="bub me">${esc(x.text)}</div>${fix}`;
    }
    const d = x.data;
    const words = (d.new_words || []).filter(w => w && w.kk);
    return `<div class="bub ai">
      <div class="tgt">${esc(d.reply)}</div>
      ${kk && state.settings.hints && d.pron ? `<div class="pr">${esc(d.pron)}</div>` : ""}
      ${x.show ? `${d.ru ? `<div class="tr">${esc(d.ru)}</div>` : ""}<div class="tr">${esc(d.en)}</div>` : ""}
      <div class="row">
        <button class="speak" data-say="${i}">${ICON}Listen</button>
        <button class="linkish" data-tr="${i}">${x.show ? "Hide translation" : "Translate"}</button>
      </div>
      ${x.show && words.length ? `<div class="chips">${words.map((w,k) => `<button class="chip" data-add="${i}.${k}">+ ${esc(w.kk)} <span class="muted">${esc(w.en || w.ru)}</span></button>`).join("")}</div>` : ""}
    </div>`;
  }).join("");
  const sugg = (!t.busy && lastAi && lastAi.data.suggestions) ? lastAi.data.suggestions.filter(s => s && s.text).slice(0,3) : [];
  $("#view").innerHTML = `
   <div class="row" style="justify-content:space-between"><button class="back" id="leave">‹ Scenes</button><span class="small muted">${esc(sc.title)} · ${kk ? "Kazakh" : "Russian"}</span></div>
   <div class="chat">${html}
     ${t.busy ? `<div class="typing">${kk ? "жазып жатыр…" : "печатает…"}</div>` : ""}
     ${t.err ? `<div class="err">${esc(t.err)} <button class="linkish" id="retry">Retry</button></div>` : ""}
   </div>
   ${sugg.length ? `<div class="sugg"><span class="small muted">Ideas (tap to use):</span>${sugg.map((s,k) => `<button class="chip" data-sg="${k}">${esc(s.text)}<small>${esc(s.en)}</small></button>`).join("")}</div>` : ""}
   <div class="compose">
     ${kk ? kbStrip("msg") : ""}
     <div class="in">
       <textarea id="msg" rows="1" placeholder="${kk ? "Жазыңыз… (or write in Russian/English)" : "Напиши́те… (or write in English)"}" aria-label="Your message">${esc(t.draft)}</textarea>
       ${dict && !dictDenied ? `<button class="speak" id="mic" aria-label="Speak instead of typing">${MIC}</button>` : ""}
       <button class="btn" id="send" ${t.busy ? "disabled" : ""}>Send</button>
     </div>
   </div>`;
  $("#leave").onclick = () => { talkS = null; render(); };
  const ta = $("#msg");
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; };
  ta.oninput = () => { t.draft = ta.value; grow(); };
  ta.onkeydown = e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendTalk(ta.value); } };
  grow();
  $("#send").onclick = () => sendTalk(ta.value);
  if(kk) wireKb();
  if($("#retry")) $("#retry").onclick = requestReply;
  $$("[data-say]").forEach(b => b.onclick = () => say(t.turns[+b.dataset.say].data.reply, sc.lang, false));
  $$("[data-tr]").forEach(b => b.onclick = () => { const x = t.turns[+b.dataset.tr]; x.show = !x.show; render(); });
  $$("[data-add]").forEach(b => b.onclick = () => { const [i,k] = b.dataset.add.split(".").map(Number); const w = t.turns[i].data.new_words[k]; addMine(w); });
  $$("[data-savefix]").forEach(b => b.onclick = () => {
    const x = t.turns[+b.dataset.savefix]; if(x.saved) return;
    if(addMine({kk:x.correction.fixed, en:"You wrote: " + x.text, note:x.correction.explain || ""})){ x.saved = true; render(); }
  });
  $$("[data-sg]").forEach(b => b.onclick = () => { t.draft = sugg[+b.dataset.sg].text; ta.value = t.draft; grow(); ta.focus(); });
  const mic = $("#mic");
  if(mic){
    let listening = false, base = "";
    mic.onclick = () => {
      if(listening){ stopDictation(); return; }
      base = ta.value ? ta.value.replace(/\s*$/," ") : "";
      const ok = startDictation({
        partial: txt => { ta.value = base + txt; },
        final: txt => { base = base + txt + " "; ta.value = base; t.draft = ta.value; grow(); },
        state: s => { listening = s === "listening"; mic.classList.toggle("on", listening); }
      });
      if(!ok) toast("Speech input isn't available here. You can keep typing.");
    };
  }
}

/* ================= QUIZ ================= */
let quizDeck = "all", quizRun = null, quizMode = "mc", buildRun = null;
const tokens = kk => clean(kk).replace(/[.!?,]/g,"").split(/\s+/).filter(Boolean);
const buildable = pool => pool.filter(c => !c.kk.includes("/") && tokens(c.kk).length >= 3 && (c.ru || c.en));
function startBuild(pool){
  const own = shuffle(buildable(pool)), ownIds = new Set(own.map(c => c.id));
  const src = own.concat(shuffle(buildable(cards()).filter(c => !ownIds.has(c.id)))).slice(0, 8);
  buildRun = {qs: src.map(c => ({c, bank: shuffle(tokens(c.kk).map((w,k) => ({w,k}))), placed:[], checked:null})), i:0, score:0};
  quiz();
}
function build(){
  const r = buildRun, pool = quizDeck === "all" ? cards() : (deckById(quizDeck)?.cards || []);
  if(r.i >= r.qs.length){
    $("#view").innerHTML = `<h2>${r.score}/${r.qs.length} sentences</h2>
     <p>${r.score >= r.qs.length-1 ? "Керемет! Your word order is solid." : "Remember: the verb goes last. Try another round."}</p>
     <button class="btn block" id="again">Another round</button><button class="btn ghost block" id="back">Back to quiz menu</button>`;
    $("#again").onclick = () => startBuild(pool);
    $("#back").onclick = () => { buildRun = null; quiz(); };
    return;
  }
  const q = r.qs[r.i];
  const answer = tokens(q.c.kk).join(" ");
  $("#view").innerHTML = `
   <div class="progress"><span>Build the sentence · ${r.score} right</span><span>${r.i+1} / ${r.qs.length}</span></div>
   <div class="q"><div class="small muted">Say this in Kazakh</div><div class="big" style="font-size:22px">${esc(q.c.ru || q.c.en)}</div><div class="muted">${esc(q.c.ru ? q.c.en : "")}</div></div>
   <div class="panel" style="min-height:64px"><div class="chips" aria-label="Your sentence">${q.placed.length ? q.placed.map((t,k) => `<button class="chip" data-un="${k}" style="font-family:var(--display);font-weight:700;font-size:17px">${esc(t.w)}</button>`).join("") : `<span class="small muted">Tap the words below in the right order.</span>`}</div></div>
   <div class="chips">${q.bank.map((t,k) => `<button class="chip" data-pk="${k}" style="font-family:var(--display);font-weight:700;font-size:17px">${esc(t.w)}</button>`).join("")}</div>
   ${q.checked == null
     ? `<button class="btn block" id="check" ${q.bank.length ? "disabled" : ""}>Check</button>`
     : `<div class="fix ${q.checked ? "ok" : ""}" style="align-self:stretch;max-width:none">${q.checked ? "Correct!" : `Correct order: <b>${esc(q.c.kk)}</b>`}${q.c.hint && state.settings.hints ? `<br><span class="small">${esc(q.c.hint)}</span>` : ""}</div>
        <div class="row"><button class="speak" id="play">${ICON}Listen</button></div>
        <button class="btn block" id="next">Next</button>`}
   <button class="linkish" id="quitb">End drill</button>`;
  $$("[data-pk]").forEach(b => b.onclick = () => { if(q.checked != null) return; q.placed.push(q.bank.splice(+b.dataset.pk,1)[0]); build(); });
  $$("[data-un]").forEach(b => b.onclick = () => { if(q.checked != null) return; q.bank.push(q.placed.splice(+b.dataset.un,1)[0]); build(); });
  if($("#check")) $("#check").onclick = () => { q.checked = q.placed.map(t => t.w).join(" ") === answer; if(q.checked) r.score++; build(); };
  if($("#play")) $("#play").onclick = () => say(q.c.kk, "kk", false);
  if($("#next")) $("#next").onclick = () => { r.i++; build(); };
  $("#quitb").onclick = () => { buildRun = null; quiz(); };
}
function startQuiz(pool){
  quizRun = {qs: shuffle(shuffle(pool).slice(0,10).map((c,i) => ({c, dir: i%2 ? "ru" : "kk"}))), i:0, score:0, picked:null, pool};
  quiz();
}
function quiz(){
  if(buildRun) return build();
  const pool = quizDeck === "all" ? cards() : (deckById(quizDeck)?.cards || []);
  if(!quizRun){
    const best = state.best[quizDeck];
    $("#view").innerHTML = `<h2>Quiz</h2>
     <div class="chips" role="group" aria-label="Quiz type"><button class="chip" aria-pressed="${quizMode==="mc"}" data-mode="mc">Multiple choice</button><button class="chip" aria-pressed="${quizMode==="build"}" data-mode="build">Build the sentence</button></div>
     <p class="muted">${quizMode === "mc" ? "10 questions. Half show Kazakh and ask the meaning; half show Russian and ask for the Kazakh." : "8 sentences. Put the Kazakh words in the right order. Phrases from this deck are used, topped up from others if it has few."}</p>
     <div class="chips">${[{id:"all",title:"All decks"}].concat(decks()).map(d => `<button class="chip" aria-pressed="${quizDeck===d.id}" data-d="${d.id}">${esc(d.title)}</button>`).join("")}</div>
     ${best != null ? `<p class="small muted">Your best on this one: ${best}/10</p>` : ""}
     ${quizMode === "mc" && pool.length < 4 ? `<p class="err">This deck needs at least 4 words for a quiz.</p>` : ""}
     <button class="btn block" id="go" ${quizMode === "mc" && pool.length < 4 ? "disabled" : ""}>Start</button>`;
    $$("[data-mode]").forEach(b => b.onclick = () => { quizMode = b.dataset.mode; quiz(); });
    $$("[data-d]").forEach(b => b.onclick = () => { quizDeck = b.dataset.d; quiz(); });
    $("#go").onclick = () => quizMode === "build" ? startBuild(pool) : startQuiz(pool);
    return;
  }
  const r = quizRun;
  if(r.i >= r.qs.length){
    const n = r.qs.length;
    const prevBest = state.best[quizDeck] ?? -1;
    if(r.score > prevBest){ state.best[quizDeck] = r.score; save(); }
    $("#view").innerHTML = `<h2>${r.score}/${n}</h2>
     <p>${r.score >= n-1 ? "Өте жақсы! Very good." : r.score >= n/2 ? "Жақсы. Review the cards you missed, then try again." : "Do a card session on this deck first, then come back."}</p>
     <button class="btn block" id="again">Try again</button>
     <button class="btn ghost block" id="back">Choose another deck</button>`;
    $("#again").onclick = () => startQuiz(pool);
    $("#back").onclick = () => { quizRun = null; quiz(); };
    return;
  }
  const q = r.qs[r.i];
  if(!q.opts){
    const others = shuffle((pool.length >= 4 ? pool : cards()).filter(c => c.id !== q.c.id && c.kk !== q.c.kk)).slice(0,3);
    q.opts = shuffle([q.c].concat(others));
  }
  const prompt = q.dir === "kk"
    ? `<div class="small muted">What does this mean?</div><div class="big">${esc(q.c.kk)}</div>`
    : `<div class="small muted">How do you say this in Kazakh?</div><div class="big" style="font-size:24px">${esc(q.c.ru || q.c.en)}</div><div class="muted">${esc(q.c.ru ? q.c.en : "")}</div>`;
  $("#view").innerHTML = `
   <div class="progress"><span>Score ${r.score}</span><span>${r.i+1} / ${r.qs.length}</span></div>
   <div class="q">${prompt}</div>
   <div class="stack">${q.opts.map((o,k) => {
     let cls = "opt";
     if(r.picked != null){ if(o.id === q.c.id) cls += " right"; else if(k === r.picked) cls += " wrong"; }
     const label = q.dir === "kk" ? `${esc(o.en || o.ru)}<small>${esc(o.en ? o.ru : "")}</small>` : `${esc(o.kk)}<small>${esc(state.settings.hints ? o.hint : "")}</small>`;
     return `<button class="${cls}" data-k="${k}">${label}</button>`; }).join("")}</div>
   ${r.picked != null ? `<div class="row"><button class="speak" id="play">${ICON}Listen</button><span class="small muted">${esc(q.c.kk)}${q.c.hint ? " · " + esc(q.c.hint) : ""}</span></div><button class="btn block" id="next">Next</button>` : ""}`;
  $$("[data-k]").forEach(b => b.onclick = () => {
    if(r.picked != null) return;
    r.picked = +b.dataset.k;
    if(q.opts[r.picked].id === q.c.id) r.score++;
    quiz();
  });
  if(r.picked != null){
    $("#play").onclick = () => say(q.c.kk, "kk", false);
    $("#next").onclick = () => { r.i++; r.picked = null; quiz(); };
  }
}

      <button class="speak" data-l="${i}">${ICON}${esc(l.say)}</button></div>`).join("")}</div>
   <div class="tip"><b>Stress:</b> in Kazakh it almost always falls on the last syllable: қаза<b>қ</b>, рақ<b>мет</b>. That alone makes you sound less Russian and less American.</div>
   <div class="tip"><b>Vowel harmony:</b> a word uses either back vowels (а о ұ ы) or front vowels (ә ө ү е і), and endings change to match. That's why it's <b>атым</b> (my name) but <b>үйім</b> (my home), <b>қалаға</b> (to the city) but <b>үйге</b> (home).</div>
   <div class="tip"><b>У and и</b> are different from Russian: у is a gliding "uw" (су = suw), и is "iy" or "ıy" (ине = iyne, needle).</div>`;
  wireBack();
  $$("[data-l]").forEach(b => b.onclick = () => say(LETTERS[+b.dataset.l].say, "kk", true));
}

let exState = {};
function grammar(){
  $("#view").innerHTML = `${backBtn()}<h2>Grammar in 6 short lessons</h2>
   <p class="muted">Just enough to build your own sentences. Each lesson takes about two minutes.</p>
   ${LESSONS.map(L => `<section class="panel lesson"><h2>${esc(L.title)}</h2>${L.body}
     ${L.ex.length ? `<h3>Try it</h3>${L.ex.map((x,k) => {
       const key = L.id + k, pick = exState[key];
       const cut = x.q.indexOf(" ("), kkPart = cut > 0 ? x.q.slice(0, cut) : x.q, enPart = cut > 0 ? x.q.slice(cut + 1) : "";
       const shown = esc(kkPart).replace("__", pick != null ? `<b>${esc(x.o[x.a])}</b>` : "<b>__</b>");
       return `<div class="stack"><div class="ex-q"><span class="kk">${shown}</span> <span class="small muted">${esc(enPart)}</span></div><div class="chips">${x.o.map((o,j) => {
         let st = ""; if(pick != null){ if(j === x.a) st = ' style="border-color:var(--good);color:var(--good);font-weight:700"'; else if(j === pick) st = ' style="border-color:var(--bad);color:var(--bad)"'; }
         return `<button class="chip" data-ex="${key}.${j}"${st}>-${esc(o)}</button>`; }).join("")}</div></div>`; }).join("")}` : ""}
   </section>`).join("")}
   <div class="tip">Put it to work: open Talk and try one sentence from each lesson. The partner will correct the endings for you.</div>`;
  wireBack();
  $$("[data-ex]").forEach(b => b.onclick = () => {
    const [key, j] = [b.dataset.ex.slice(0, b.dataset.ex.lastIndexOf(".")), +b.dataset.ex.slice(b.dataset.ex.lastIndexOf(".")+1)];
    if(exState[key] != null) return;
    exState[key] = j;
    const y = window.scrollY; grammar(); window.scrollTo(0, y);
  });
}

let heard = {};
function russian(){
  const canMic = dict && !dictDenied;
  $("#view").innerHTML = `${backBtn()}<h2>Russian accent coach</h2>
   <p class="muted">Eight habits that make Russian sound American. Listen, then copy the rhythm out loud right away. Stressed vowels are marked: о́.${canMic ? " Tap the mic to check whether a speech recogniser understands you." : ""}</p>
   ${RUSSIAN.map((s,si) => `<section class="sec"><h2>${esc(s.title)}</h2><p class="small">${esc(s.tip)}</p>
     ${s.items.map((it,ii) => { const h = heard[si+"."+ii]; return `<div class="item">
        <div class="w">${esc(it.w)}</div>
        <div class="b"><button class="speak" data-r="${si}.${ii}" aria-label="Listen to ${esc(it.w)}">${ICON}</button><button class="speak" data-rs="${si}.${ii}" aria-label="Listen slowly">Slow</button>${canMic ? `<button class="speak" data-rm="${si}.${ii}" aria-label="Say it and check">${MIC}</button>` : ""}</div>
        ${it.s ? `<div class="snd">${esc(it.s)}</div>` : ""}
        <div class="m">${esc(it.m)}</div>
        ${h ? `<div class="heard${h.ok ? " ok" : ""}">${h.listening ? "Listening… say it now" : `Heard: «${esc(h.text || "nothing")}» ${h.ok ? "✓ Understood" : "· Try again, slower"}`}</div>` : ""}
     </div>`; }).join("")}
   </section>`).join("")}`;
  wireBack();
  const get = v => { const [a,b] = v.split(".").map(Number); return RUSSIAN[a].items[b].w; };
  $$("[data-r]").forEach(b => b.onclick = () => say(get(b.dataset.r), "ru", false));
  $$("[data-rs]").forEach(b => b.onclick = () => say(get(b.dataset.rs), "ru", true));
  $$("[data-rm]").forEach(b => b.onclick = () => {
    const key = b.dataset.rm, target = normText(get(key)).split(" ");
    let text = "";
    const rerender = () => { const y = window.scrollY; russian(); window.scrollTo(0, y); };
    const ok = startDictation({
      partial: t => { text = t; },
      final: t => { text = (text && text !== t ? text + " " : "") + t; },
      state: s => {
        if(s === "listening"){ heard[key] = {listening:true}; rerender(); }
        else { const got = normText(text); heard[key] = {text, ok: target.every(w => got.split(" ").includes(w))}; rerender(); }
      }
    });
    if(ok) setTimeout(stopDictation, 3500);
    else toast("Speech input isn't available here.");
  });
}

let mineForm = {kk:"", ru:"", en:"", busy:false, err:""}, mineConfirm = null;
function mine(){
  const f = mineForm;
  $("#view").innerHTML = `${backBtn()}<h2>My words</h2>
   <p class="muted">Heard a word on a visit? Add it here and it joins your cards and quizzes.</p>
   <div class="panel">
     <label for="w-kk">Kazakh</label>${kbStrip("w-kk")}<input type="text" id="w-kk" value="${esc(f.kk)}" placeholder="e.g. Жаңбыр" autocomplete="off">
     <label for="w-ru">Russian</label><input type="text" id="w-ru" value="${esc(f.ru)}" placeholder="e.g. Дождь" autocomplete="off">
     <label for="w-en">English</label><input type="text" id="w-en" value="${esc(f.en)}" placeholder="e.g. Rain" autocomplete="off">
     ${f.err ? `<p class="err">${esc(f.err)}</p>` : ""}
     <div class="row">
       <button class="btn" id="w-add">Add word</button>
       ${sampleState === "ready" ? `<button class="btn ghost" id="w-fill" ${f.busy ? "disabled" : ""}>${f.busy ? "Filling in…" : "Fill in the rest with Claude"}</button>` : ""}
     </div>
     ${sampleState === "ready" ? `<p class="small muted">Type one field (Kazakh, Russian or English), and Claude fills in the others plus a pronunciation hint.</p>` : ""}
   </div>
   <div class="stack">${state.mine.length ? state.mine.slice().reverse().map(w => `<div class="word">
      <div class="kk">${esc(w.kk)}</div>
      <div class="b"><button class="speak" data-ms="${w.id}" aria-label="Listen">${ICON}</button>${mineConfirm === w.id ? `<button class="btn bad sm" data-mdel="${w.id}">Delete?</button>` : `<button class="speak" data-mx="${w.id}" aria-label="Remove ${esc(w.kk)}">✕</button>`}</div>
      <small>${esc([w.ru, w.en].filter(Boolean).join(" · "))}${w.hint ? " · " + esc(w.hint) : ""}</small></div>`).join("") : `<p class="small muted">No words yet.</p>`}</div>
   ${state.mine.length ? `<button class="btn block" id="w-study">Study my words</button>` : ""}`;
  wireBack(); wireKb();
  ["kk","ru","en"].forEach(k => { const el = $("#w-"+k); el.oninput = () => { f[k] = el.value; }; });
  $("#w-add").onclick = () => {
    if(!f.kk.trim()){ f.err = "Add the Kazakh word first" + (sampleState === "ready" ? ", or tap \"Fill in the rest with Claude\"." : "."); mine(); return; }
    if(!f.ru.trim() && !f.en.trim()){ f.err = "Add a Russian or English meaning too."; mine(); return; }
    if(addMine({kk:f.kk, ru:f.ru, en:f.en, hint:f.hint, note:f.note})) mineForm = {kk:"", ru:"", en:"", busy:false, err:""};
    mine();
  };
  if($("#w-fill")) $("#w-fill").onclick = async () => {
    if(!f.kk.trim() && !f.ru.trim() && !f.en.trim()){ f.err = "Type a word in at least one box first."; mine(); return; }
    f.busy = true; f.err = ""; mine();
    try{
      const r = await askJSON(`Fill in a vocabulary card for a beginner learning Kazakh. Given (some fields may be empty): Kazakh: «${f.kk}», Russian: «${f.ru}», English: «${f.en}». Use the most common everyday Kazakh word (Cyrillic, with correct letters ә ғ қ ң ө ұ ү һ і). If the given Kazakh is misspelled, correct it. Respond with ONLY JSON: {"kk":"","ru":"","en":"","hint":"Latin pronunciation using ä ö ü ı q ğ ñ","note":"one short usage tip in English, or empty"}`, {modelTier:"quick"});
      Object.assign(f, {kk:r.kk || f.kk, ru:r.ru || f.ru, en:r.en || f.en, hint:r.hint || "", note:r.note || ""});
    }catch(e){ f.err = aiError(e); }
    f.busy = false; mine();
  };
  $$("[data-ms]").forEach(b => b.onclick = () => say(state.mine.find(w => w.id === b.dataset.ms).kk, "kk", false));
  $$("[data-mx]").forEach(b => b.onclick = () => { mineConfirm = b.dataset.mx; mine(); });
  $$("[data-mdel]").forEach(b => b.onclick = () => {
    state.mine = state.mine.filter(w => w.id !== b.dataset.mdel); delete state.cards[b.dataset.mdel];
    mineConfirm = null; save(); mine();
  });
  if($("#w-study")) $("#w-study").onclick = () => startSession("mine");
}

let resetArmed = false;
function settings(){
  const s = state.settings;
  $("#view").innerHTML = `${backBtn()}<h2>Settings</h2>
   <div class="panel">
     <label for="s-new">New cards per session
       <select id="s-new">${[5,8,12,20].map(n => `<option value="${n}" ${s.newPer===n?"selected":""}>${n}</option>`).join("")}</select></label>
     <label for="s-hints">Pronunciation hints (Latin letters)
       <select id="s-hints"><option value="1" ${s.hints?"selected":""}>Show</option><option value="0" ${!s.hints?"selected":""}>Hide, I read Cyrillic</option></select></label>
     <label for="s-ex">Corrections in Talk are explained in
       <select id="s-ex"><option value="ru" ${s.explain==="ru"?"selected":""}>Russian (extra practice)</option><option value="en" ${s.explain==="en"?"selected":""}>English</option></select></label>
   </div>
   <div class="panel">
     <h2 style="font-size:18px">Reset progress</h2>
     <p class="small muted">Clears your card schedule, streak and quiz scores on every device. Your own words stay.</p>
     <button class="btn ${resetArmed ? "bad" : "ghost"}" id="s-reset">${resetArmed ? "Tap again to reset everything" : "Reset progress"}</button>
   </div>
   <p class="small muted">Version 3 · ${cards().length} cards · progress ${dbRef ? "synced to your Claude account" : "saved on this device"}</p>`;
  wireBack();
  $("#s-new").onchange = e => { s.newPer = +e.target.value; save(); };
  $("#s-hints").onchange = e => { s.hints = e.target.value === "1"; save(); };
  $("#s-ex").onchange = e => { s.explain = e.target.value; save(); };
  $("#s-reset").onclick = () => {
    if(!resetArmed){ resetArmed = true; settings(); setTimeout(() => { if(resetArmed){ resetArmed = false; if(sub === "settings") settings(); } }, 5000); return; }
    resetArmed = false;
    state.cards = {}; state.streak = 0; state.lastDay = null; state.best = {}; state.today = {day:null, n:0};
    save(); toast("Progress reset."); settings();
  };
}

  if(b.dataset.tab === tab){
    if(tab === "learn") session = null;
    if(tab === "quiz"){ quizRun = null; buildRun = null; }
  }
  go(b.dataset.tab);

go("home");

(async function cloud(){
  try{
    const [db, user] = await Promise.all([capUse("db"), capUse("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    dbRef = db.collection("data/users/" + id).doc("progress");
    const snap = await Promise.race([dbRef.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    let d = snap;
    if(snap && typeof snap.data === "function") d = snap.data();
    else if(snap && snap.data && typeof snap.data === "object") d = snap.data;
    if(d && d.cards && (d.updatedAt||0) > (state.updatedAt||0)){
      state = normalize(d);
      try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
      if(!session && !quizRun && !talkS) render();
    }else if(state.updatedAt){ pushRemote(); }
    setSync("Synced");
  }catch(e){ /* stay on device storage */ }
})();
</script>
