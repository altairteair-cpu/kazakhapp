<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kazakh &amp; Russian Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a journey across Kazakhstan. Sky-blue + steppe-gold from the flag; a winding road of city stops; game HUD on top. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#10222B; --muted:#576A73; --line:#DAE3E8;
  --sky:#00849B; --sky-soft:#E1F3F6; --gold:#B88300; --gold-soft:#FBF1D6; --gold-hi:#F2C230;
  --good:#1D8048; --bad:#B93E2B; --on-accent:#FFFFFF;
  --display:"PT Serif", Georgia, "Times New Roman", serif;
  --body:"PT Sans", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B161B; --surface:#13232A; --ink:#E7F0F3; --muted:#93A7B0; --line:#24373F;
    --sky:#3BC3DA; --sky-soft:#12333B; --gold:#F0C23A; --gold-soft:#3A2F10; --gold-hi:#F7D460;
    --good:#4CC27F; --bad:#F27B66; --on-accent:#06222A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B161B; --surface:#13232A; --ink:#E7F0F3; --muted:#93A7B0; --line:#24373F;
  --sky:#3BC3DA; --sky-soft:#12333B; --gold:#F0C23A; --gold-soft:#3A2F10; --gold-hi:#F7D460;
  --good:#4CC27F; --bad:#F27B66; --on-accent:#06222A; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
/* HUD */
header{position:sticky;top:0;z-index:6;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:3px solid var(--gold);background:var(--surface)}
.hud{display:flex;align-items:center;gap:10px}
.lvl{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--gold);background:var(--gold-soft);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:19px;line-height:1;padding:0}
.xpw{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rank{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;white-space:nowrap}
.rank b{font-family:var(--display);font-size:16px}
.rank small{color:var(--muted);font-variant-numeric:tabular-nums}
.xpbar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-hi));border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;background:none;border:0;padding:4px;cursor:pointer}
.pill svg{width:22px;height:22px}
.pill.streak svg{fill:var(--gold)}
.pill.chest svg{fill:var(--sky)}
.pill.chest{animation:bob 1.6s ease-in-out infinite}
.pill[hidden]{display:none}
@keyframes bob{50%{transform:translateY(-3px)}}
main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
body.in-lesson nav{display:none}
body.in-lesson main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
h2{font-family:var(--display);font-size:21px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:4px 0 0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--sky);color:var(--on-accent);min-height:48px;box-shadow:0 3px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.btn.ghost{background:transparent;color:var(--sky);border:1.5px solid var(--sky);box-shadow:none}
.btn.block{width:100%}
.btn.bad{background:var(--bad);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn.good{background:var(--good);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 60%,#000)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.linkish{background:none;border:0;color:var(--sky);padding:4px 0;cursor:pointer;font-size:14px;text-decoration:underline}
.tip{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.back{align-self:flex-start;background:none;border:0;color:var(--sky);font-weight:700;cursor:pointer;padding:4px 0}
.err{color:var(--bad);font-size:14.5px}
a{color:var(--sky)}
/* daily panel */
.daily{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}
.ring{width:76px;height:76px}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring text{font-family:var(--display);font-weight:700;font-size:20px;fill:var(--ink)}
/* journey map */
.road{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px 0 10px}
.road svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.road svg.path path{fill:none;stroke:var(--line);stroke-width:6;stroke-dasharray:2 12;stroke-linecap:round}
.stop{position:relative;display:flex;align-items:center;gap:12px;width:78%;background:none;border:0;padding:6px 0;cursor:pointer;text-align:left}
.stop.r{align-self:flex-end;flex-direction:row-reverse;text-align:right}
.node{flex:0 0 auto;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:4px solid var(--line);font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted);box-shadow:0 5px 0 var(--line)}
.stop.done .node{border-color:var(--gold);color:var(--gold);box-shadow:0 5px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.stop.cur .node{border-color:var(--sky);background:var(--sky);color:var(--on-accent);box-shadow:0 5px 0 color-mix(in srgb,var(--sky) 55%,#000);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{outline:0 solid transparent}50%{outline:8px solid color-mix(in srgb,var(--sky) 25%,transparent)}}
.stop.lock .node{opacity:.55}
.stop .lbl{display:flex;flex-direction:column;min-width:0}
.stop .lbl b{font-family:var(--display);font-size:18px}
.stop .lbl small{color:var(--muted);font-size:13.5px}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
.stars .off{color:var(--line)}
.flag{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sky)}
/* city sheet */
.city h2{font-size:28px}
.fact{font-style:italic;color:var(--muted)}
/* flashcard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer;box-shadow:0 6px 24px rgba(0,40,55,.07)}
.card .big{font-family:var(--display);font-size:32px;line-height:1.2;font-weight:700;text-wrap:balance}
.card .hint{font-style:italic;color:var(--sky);font-size:16px}
.card .ru{font-size:20px}
.card .en{font-size:17px;color:var(--muted)}
.card .note{font-size:14.5px;color:var(--ink);background:var(--sky-soft);border-radius:10px;padding:10px 12px;margin-top:6px;text-align:left}
.card .label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.speak{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;min-height:38px}
.speak svg{width:16px;height:16px;fill:var(--sky)}
.speak.on{border-color:var(--bad);color:var(--bad)} .speak.on svg{fill:var(--bad)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
/* lesson */
.ltop{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 6px}
.lbar{height:14px;border-radius:14px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--sky);border-radius:14px;transition:width .4s}
.combo{font-weight:700;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.combo.hot{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.3)}}
.prompt{font-family:var(--display);font-size:28px;font-weight:700;text-align:center;text-wrap:balance}
.ask{text-align:center;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:54px;box-shadow:0 3px 0 var(--line)}
.opt small{display:block;color:var(--muted);font-size:13.5px}
.opt.sel{border-color:var(--sky);background:var(--sky-soft)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt .kk,.tile.kk{font-family:var(--display);font-weight:700;font-size:18px}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.feedback .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.feedback.ok{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-top-color:var(--good)}
.feedback.no{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-top-color:var(--bad)}
.feedback .msg{font-weight:700;font-size:18px}
.feedback.ok .msg{color:var(--good)} .feedback.no .msg{color:var(--bad)}
.feedback .ans{font-family:var(--display);font-size:18px}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;min-height:56px;cursor:pointer;box-shadow:0 3px 0 var(--line);font-size:15px;text-align:center}
.tile.sel{border-color:var(--sky);background:var(--sky-soft)}
.tile.gone{visibility:hidden}
.tile.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* build */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;text-align:left}
.chip:disabled{opacity:.55;cursor:default}
.chip[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--sky);font-weight:700}
.wordchip{font-family:var(--display);font-weight:700;font-size:17px;border-radius:10px;box-shadow:0 3px 0 var(--line)}
.slot{min-height:64px;border-bottom:2px solid var(--line);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* results */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.result .big{font-family:var(--display);font-size:44px;font-weight:700;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
/* treasures */
.treasures{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tr{border-radius:14px;padding:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-height:120px}
.tr .mono{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;background:var(--gold-soft);color:var(--gold);border:2px solid var(--gold)}
.tr b{font-family:var(--display)}
.tr p{font-size:13.5px;color:var(--muted)}
.tr.locked{opacity:.5}
.tr.locked .mono{background:var(--line);border-color:var(--line);color:var(--muted)}
/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,15,20,.55)}
#modal.on{display:flex}
#modal .box{background:var(--surface);border-radius:20px;padding:24px 20px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:rise .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes rise{from{transform:translateY(30px) scale(.9);opacity:0}}
#modal .huge{font-family:var(--display);font-size:56px;font-weight:700;color:var(--gold);line-height:1}
#modal h2{font-size:24px}
.chestbig{width:120px;height:110px}
.chestbig.shake{animation:shake .25s 4}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
/* misc kept from v3 */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.letter .L{font-family:var(--display);font-size:36px;font-weight:700;color:var(--sky);line-height:1}
.letter p{font-size:14.5px} .letter .ex{font-size:14px;color:var(--muted)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:19px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding-top:10px;border-top:1px solid var(--line);align-items:center}
.item .w{font-family:var(--display);font-size:21px;font-weight:700}
.item .snd{color:var(--sky);font-size:15px}
.item .m{font-size:14px;color:var(--muted);grid-column:1}
.item .b{grid-row:1 / span 3;grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.item .heard{grid-column:1 / -1;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--sky-soft)}
.heard.ok{background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.menu{display:flex;flex-direction:column;gap:10px}
.menu button{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.menu button b{font-family:var(--display);font-size:19px;color:var(--sky);text-align:center}
.menu button span{display:flex;flex-direction:column}
.menu button small{color:var(--muted);font-size:14px}
.lesson h2{font-size:20px}
.lesson table{border-collapse:collapse;width:100%;font-size:15px}
.lesson td,.lesson th{border-bottom:1px solid var(--line);padding:6px 8px 6px 0;text-align:left;vertical-align:top}
.lesson th{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl{overflow-x:auto}
.kk{font-family:var(--display);font-weight:700}
.ex-q{font-size:17px} .ex-q b{color:var(--sky)}
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;border-radius:16px;padding:11px 14px;display:flex;flex-direction:column;gap:6px}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--sky);color:var(--on-accent);border-bottom-right-radius:4px}
.bub .tgt{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.3}
.bub .pr{font-style:italic;color:var(--sky);font-size:14.5px}
.bub .tr2{font-size:15px;color:var(--muted)}
.fix{align-self:flex-end;max-width:88%;font-size:14.5px;border-radius:12px;padding:9px 12px;background:var(--gold-soft);border-left:4px solid var(--gold)}
.fix.ok{background:color-mix(in srgb,var(--good) 12%,var(--surface));border-left-color:var(--good)}
.fix b{font-family:var(--display)}
.typing{align-self:flex-start;color:var(--muted);font-style:italic;font-size:15px}
.compose{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.compose .in{display:flex;gap:8px;align-items:flex-end}
textarea,input[type=text],select{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:17px}
textarea{resize:none;min-height:48px;max-height:140px}
.kb{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.kb button{flex:0 0 auto;min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:19px;font-weight:700;cursor:pointer}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg .chip small{display:block;color:var(--muted);font-weight:400}
label{font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:5px}
.word{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.word .kk{font-size:19px} .word small{color:var(--muted);grid-column:1}
.word .b{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:10px 2px 9px;font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;position:relative}
nav button b{font-family:var(--display);font-size:19px;line-height:1}
nav button[aria-current="page"]{color:var(--sky);font-weight:700}
nav .dot{position:absolute;top:2px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:25}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.card .big{font-size:28px}.prompt{font-size:24px}.stop{width:88%}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hud">
      <button class="lvl" id="hudLvl" aria-label="Your level"><span id="lvN">1</span></button>
      <div class="xpw">
        <div class="rank"><span><b id="rankKk">Қонақ</b> <span class="muted" id="rankEn">Guest</span></span><small id="xpTxt">0 / 100 XP</small></div>
        <div class="xpbar"><i id="xpBar"></i></div>

const LESSONS = [
 {id:"order", title:"1. Word order: the verb goes last", body:`
  <p>Kazakh puts the verb at the end of the sentence. Think "I tea drink", not "I drink tea".</p>
  <div class="tbl"><table><tr><th>Kazakh</th><th>Word by word</th><th>Meaning</th></tr>
  <tr><td class="kk">Мен шай ішемін.</td><td>I tea drink</td><td>I drink tea.</td></tr>
  <tr><td class="kk">Әжем ауылда тұрады.</td><td>my-grandma village-in lives</td><td>My grandma lives in the village.</td></tr>
  <tr><td class="kk">Мен қазақ тілін үйреніп жүрмін.</td><td>I Kazakh language learning am</td><td>I'm learning Kazakh.</td></tr></table></div>
  <p>Endings do the work that prepositions do in Russian and English: <span class="kk">ауыл-да</span> = in the village.</p>`,
  ex:[]},
 {id:"verbs", title:"2. Verb endings: who is doing it", body:`
  <p>The present/future tense is <b>verb stem + а/е/й + person ending</b>. The ending tells you who, so <span class="kk">мен</span> is often dropped.</p>
  <div class="tbl"><table><tr><th>Person</th><th>бару (to go)</th><th>білу (to know)</th></tr>
  <tr><td>Мен (I)</td><td class="kk">барамын</td><td class="kk">білемін</td></tr>
  <tr><td>Сен (you, casual)</td><td class="kk">барасың</td><td class="kk">білесің</td></tr>
  <tr><td>Сіз (you, polite)</td><td class="kk">барасыз</td><td class="kk">білесіз</td></tr>
  <tr><td>Ол (he/she)</td><td class="kk">барады</td><td class="kk">біледі</td></tr>
  <tr><td>Біз (we)</td><td class="kk">барамыз</td><td class="kk">білеміз</td></tr>
  <tr><td>Олар (they)</td><td class="kk">барады</td><td class="kk">біледі</td></tr></table></div>
  <p><b>Not:</b> add <span class="kk">-ма/-ме/-ба/-бе/-па/-пе</span> to the stem: <span class="kk">бармаймын</span> (I won't go), <span class="kk">білмеймін</span> (I don't know).</p>`,
  ex:[
   {q:"Мен шай іше__. (I drink tea)", o:["мін","сіз","ді"], a:0},
   {q:"Сіз қазақша сөйлей__ бе? (Do you speak Kazakh?)", o:["мін","сіз","ді"], a:1},
   {q:"Әжем ауылда тұра__. (Grandma lives in the village)", o:["мын","ды","сыз"], a:1},
   {q:"Біз ауылға бара__. (We're going to the village)", o:["мыз","сың","ды"], a:0}]},
 {id:"poss", title:"3. My, your: possessive endings", body:`
  <p>"My" and "your" are endings on the noun. <span class="kk">Менің</span> (my) and <span class="kk">сіздің</span> (your) are optional, for emphasis.</p>
  <div class="tbl"><table><tr><th></th><th>after a vowel</th><th>after a consonant</th></tr>
  <tr><td>my</td><td class="kk">әке<b>м</b>, ана<b>м</b></td><td class="kk">ат<b>ым</b>, үй<b>ім</b></td></tr>
  <tr><td>your (polite)</td><td class="kk">әке<b>ңіз</b>, ана<b>ңыз</b></td><td class="kk">ат<b>ыңыз</b>, үй<b>іңіз</b></td></tr>
  <tr><td>his/her</td><td class="kk">әке<b>сі</b>, ана<b>сы</b></td><td class="kk">ат<b>ы</b>, үй<b>і</b></td></tr></table></div>
  <p>Back-vowel words (а о ұ ы) take <b>ы</b>; front-vowel words (ә ө ү е і) take <b>і</b>. That's vowel harmony.</p>`,
  ex:[
   {q:"Менің ат__ Арман. (My name is Arman)", o:["ым","ыңыз","ы"], a:0},
   {q:"Сіздің үй__ қайда? (Where is your home?)", o:["ім","іңіз","і"], a:1},
   {q:"Менің ана__ дәрігер. (My mother is a doctor)", o:["м","ңыз","сы"], a:0}]},
 {id:"cases", title:"4. To, in, from: three endings you need daily", body:`
  <div class="tbl"><table><tr><th>Meaning</th><th>Ending</th><th>Examples</th></tr>
  <tr><td>to, toward</td><td class="kk">-ға/-ге, -қа/-ке, -а/-е</td><td class="kk">үйге, қалаға, мектепке, қазаққа</td></tr>
  <tr><td>in, at</td><td class="kk">-да/-де, -та/-те</td><td class="kk">үйде, қалада, мектепте</td></tr>
  <tr><td>from</td><td class="kk">-дан/-ден, -тан/-тен, -нан/-нен</td><td class="kk">үйден, қаладан, Қазақстаннан</td></tr></table></div>
  <p>Pick the version in two steps. <b>Vowel:</b> back-vowel word → а; front-vowel word → е. <b>Consonant:</b> after к қ п с т ш use the voiceless ones (қ/к, т); "from" uses н after м н ң.</p>
  <p class="small muted">After a possessive ending, "to" becomes just -а/-е: <span class="kk">үйіме</span> (to my home).</p>`,
  ex:[
   {q:"Мен үй__ барамын. (I'm going home)", o:["ге","де","ден"], a:0},

   {q:"Біз қала__ барамыз. (We're going to the city)", o:["ге","ға","да"], a:1},
   {q:"Інім мектеп__ оқиды. (My little brother studies at school)", o:["те","де","ке"], a:0}]},
 {id:"q", title:"5. Yes/no questions: ма, ба, па", body:`
  <p>Turn any sentence into a yes/no question by adding a question word at the end. Which one depends on the last sound and on vowel harmony:</p>
  <div class="tbl"><table><tr><th>Last sound</th><th>Back / front</th><th>Example</th></tr>
  <tr><td>vowel, р, л, у, й</td><td class="kk">ма / ме</td><td class="kk">Нан бар ма? Келе ме?</td></tr>
  <tr><td>м, н, ң, ж, з</td><td class="kk">ба / бе</td><td class="kk">Қазақсыз ба? Шай ішесіз бе?</td></tr>
  <tr><td>voiceless (к қ п с т ш)</td><td class="kk">па / пе</td><td class="kk">Рас па? Көп пе?</td></tr></table></div>`,
  ex:[

  <p>Kazakh shows how an action is happening with a helper verb after <b>stem + -ып/-іп/-п</b>:</p>
  <div class="tbl"><table><tr><th>Helper</th><th>Meaning</th><th>Example</th></tr>
  <tr><td class="kk">жатыр</td><td>happening right now</td><td class="kk">Не істеп жатырсың?<br><span class="small muted">What are you doing (right now)?</span></td></tr>
  <tr><td class="kk">отыр</td><td>doing it while sitting</td><td class="kk">Шай ішіп отырмыз.<br><span class="small muted">We're (sitting) drinking tea.</span></td></tr>
  <tr><td class="kk">жүр</td><td>ongoing, these days</td><td class="kk">Қазақ тілін үйреніп жүрмін.<br><span class="small muted">I'm learning Kazakh (these days).</span></td></tr></table></div>
  <p class="small muted">After a stem ending in a vowel, "right now" often uses -а/-е/-й: <span class="kk">келе жатырмын</span> (I'm on my way).</p>`,
  ex:[]}

/* ================= GAME CORE ================= */
function levelInfo(xp){
  let L = 1, base = 0, need = 100;
  while(xp >= base + need){ base += need; L++; need = 100 + 40*(L-1); }
  return {L, into: xp - base, need};
}
function rankFor(L){ return RANKS.filter(r => r.L <= L).pop(); }
function todayRec(){ if(state.today.day !== day()) state.today = {day:day(), n:0, xp:0, goalHit:false}; return state.today; }
function bumpStreak(){
  const t = day(); todayRec();
  if(state.lastDay === t) return;
  state.streak = (state.lastDay === day(-1)) ? (state.streak||0) + 1 : 1;
  state.lastDay = t;
}
let pending = [];   // queued celebrations: {type:"level", L} | {type:"goal"}
function addXP(n, defer){
  if(n <= 0) return;
  const before = levelInfo(state.xp).L;
  state.xp += n;
  const t = todayRec(); t.xp += n; t.n++;
  bumpStreak();
  const after = levelInfo(state.xp).L;
  if(after > before){ state.chests += after - before; pending.push({type:"level", L:after}); }
  if(!t.goalHit && t.xp >= state.settings.goal){ t.goalHit = true; state.chests++; pending.push({type:"goal"}); }
  save(); hud();
  if(!defer) flush();
}
function hud(){
  const li = levelInfo(state.xp), r = rankFor(li.L);
  $("#lvN").textContent = li.L;
  $("#rankKk").textContent = r.kk; $("#rankEn").textContent = r.en;
  $("#xpTxt").textContent = `${li.into} / ${li.need} XP`;
  $("#xpBar").style.width = Math.round(100*li.into/li.need) + "%";
  const streak = (state.lastDay === day() || state.lastDay === day(-1)) ? state.streak : 0;
  $("#stN").textContent = streak;
  $("#hudChest").hidden = !state.chests; $("#chN").textContent = state.chests;
  const due = cards().filter(isDue).length;
  const nb = document.querySelector('nav button[data-tab="learn"]');
  let dot = nb.querySelector(".dot");
  if(due){ if(!dot){ dot = document.createElement("span"); dot.className = "dot"; nb.appendChild(dot); } dot.textContent = due > 99 ? "99+" : due; }
  else if(dot) dot.remove();
}
function flush(){
  if(!pending.length || $("#modal").classList.contains("on") || (lesson && !lesson.finished)) return;
  const ev = pending.shift();
  if(ev.type === "level"){
    const r = rankFor(ev.L), newRank = RANKS.some(x => x.L === ev.L);
    beep("level"); confetti();
    modal(`<div class="flag">Level up</div><div class="huge">${ev.L}</div>
      <h2>${newRank ? `New rank: ${esc(r.kk)}` : "Деңгей көтерілді!"}</h2>
      <p class="muted">${newRank ? esc(r.en) + ". " : ""}You earned a treasure chest.</p>
      <button class="btn gold block" id="mOpen">Open the chest</button><button class="linkish" id="mClose">Later</button>`, () => {
      $("#mOpen").onclick = () => openChest();
      $("#mClose").onclick = closeModal;
    });
  }else if(ev.type === "goal"){
    beep("level"); confetti();
    modal(`<div class="flag">Daily goal</div><h2>Бүгінгі мақсат орындалды!</h2>
      <p class="muted">You hit ${state.settings.goal} XP today. Here's a chest.</p>
      <button class="btn gold block" id="mOpen">Open the chest</button><button class="linkish" id="mClose">Later</button>`, () => {
      $("#mOpen").onclick = () => openChest();
      $("#mClose").onclick = closeModal;
    });
  }
}
function modal(html, wire){ $("#modalBox").innerHTML = html; $("#modal").classList.add("on"); if(wire) wire(); const f = $("#modalBox button"); if(f) f.focus(); }
function closeModal(){ $("#modal").classList.remove("on"); render(); setTimeout(flush, 250); }
const CHEST_SVG = `<svg class="chestbig" viewBox="0 0 120 110" aria-hidden="true"><rect x="10" y="44" width="100" height="58" rx="8" fill="var(--gold)"/><path d="M10 44 Q10 10 60 10 Q110 10 110 44 Z" fill="var(--gold-hi)"/><rect x="10" y="40" width="100" height="10" style="fill:var(--ink);opacity:.35"/><rect x="52" y="44" width="16" height="22" rx="3" fill="var(--sky)"/><path d="M28 60h14M78 60h14M28 76h64" style="stroke:var(--ink);opacity:.3" stroke-width="3"/></svg>`;
function openChest(){

/* ---- sound & confetti ---- */
let actx = null;
function beep(kind){
  if(!state.settings.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const seq = {ok:[[587,0],[880,.08]], bad:[[196,0],[165,.1]], level:[[523,0],[659,.09],[784,.18],[1047,.27]], tick:[[740,0]], pair:[[880,0]]}[kind] || [[660,0]];
    seq.forEach(([f,dt]) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + dt;
      o.type = kind === "bad" ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.28);
    });
  }catch(e){}
}
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue("--gold").trim(), cs.getPropertyValue("--sky").trim(), cs.getPropertyValue("--gold-hi").trim(), cs.getPropertyValue("--good").trim()];
  const P = Array.from({length:120}, () => ({x:W/2 + (Math.random()-.5)*80, y:H*.35, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, r:Math.random()*6+3, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, s:(Math.random()-.5)*.3}));
  let t0 = null;
  function step(ts){
    if(!t0) t0 = ts; const el = ts - t0;
    ctx.clearRect(0,0,W,H);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - el/2200); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(el < 2200) requestAnimationFrame(step); else ctx.clearRect(0,0,W,H);
  }
  requestAnimationFrame(step);
}

/* ---- stars & unlocking ---- */
function stars(deckId){
  const d = deckById(deckId); if(!d || !d.cards.length) return 0;
  const frac = b => d.cards.filter(c => (state.cards[c.id]?.box || 0) >= b).length / d.cards.length;
  return frac(3) >= .8 ? 3 : frac(2) >= .8 ? 2 : frac(1) >= .8 ? 1 : 0;
}
function seenFrac(deckId){ const d = deckById(deckId); return d.cards.filter(c => (state.cards[c.id]?.box||0) >= 1).length / d.cards.length; }
function unlocked(i){
  if(i === 0) return true;
  if((state.reach||0) < i && stars(JOURNEY[i-1].deck) >= 1){ state.reach = i; save(); }
  return i <= (state.reach||0);   // once a city is unlocked it stays unlocked
}
const starStr = n => `<span class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(k => k <= n ? "★" : '<span class="off">★</span>').join("")}</span>`;

/* ================= CAPABILITIES ================= */
let claudeTTS = null, dict = null, dictHandler = null, dictDenied = false;
let sampleFn = null, sampleState = "loading";
function capUse(name){
  if(!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
  try{ return Promise.resolve(window.claude.use(name)).catch(() => null); }catch(e){ return Promise.resolve(null); }
}
capUse("tts").then(t => { claudeTTS = t; });
capUse("dictation").then(d => {
  if(!d) return;
  dict = d;
  try{
    d.onPartial(({text}) => dictHandler && dictHandler.partial && dictHandler.partial(text));
    d.onFinal(({text}) => dictHandler && dictHandler.final && dictHandler.final(text));
    d.onState(({state:s}) => dictHandler && dictHandler.state && dictHandler.state(s));
  }catch(e){ dict = null; }
  if(tab === "talk" || (tab === "more" && sub === "accent")) render();
});
capUse("sample").then(s => {
  sampleFn = s; sampleState = s ? "ready" : "none";
  if(tab === "talk" || (tab === "more" && sub === "mine")) render();
});
setTimeout(() => { if(sampleState === "loading"){ sampleState = "none"; if(tab === "talk") render(); } }, 11000);

function startDictation(handler){
  if(!dict || dictDenied) return false;
  dictHandler = handler;
  let p;
  try{ p = dict.start(); }catch(e){ handler.state && handler.state("idle"); return false; }
  Promise.resolve(p).catch(e => {
    handler.state && handler.state("idle");
    if(e && e.code === "not_granted"){ dictDenied = true; toast("Microphone is off for this page. You can keep typing."); render(); }
  });
  return true;
}
function stopDictation(){ if(dict){ try{ Promise.resolve(dict.stop()).catch(()=>{}); }catch(e){} } }

async function askJSON(input, opts){
  if(!sampleFn) throw {code:"unavailable"};
  opts = Object.assign({modelTier:"default", cache:false}, opts || {});
  if(typeof sampleFn.json === "function"){
    try{
      const v = await sampleFn.json(input, opts);
      if(v && typeof v === "object") return v;
      if(typeof v === "string") return parseJSON(v);
    }catch(e){
      if(e && (e.code === "not_granted" || e.code === "rate_limited")) throw e;
    }
  }
  const r = await sampleFn(input, opts);
  return parseJSON(r && r.text != null ? r.text : String(r));
}
function parseJSON(t){
  const m = String(t).match(/\{[\s\S]*\}/);
  if(!m) throw {code:"bad_json"};
  return JSON.parse(m[0]);
}
function aiError(e){
  if(e && e.code === "not_granted"){ sampleState = "none"; return "The AI partner is switched off for this page. You can turn it back on from the page's permission settings in Claude."; }
  if(e && e.code === "rate_limited") return "Too many messages in a short time. Wait a minute, then tap Retry.";
  if(e && e.code === "unavailable") return "The AI partner only works when this page is open inside Claude.";
  return "Something went wrong getting a reply. Tap Retry.";
}

function findVoice(lang){
  if(!("speechSynthesis" in window)) return null;
  try{ return speechSynthesis.getVoices().find(v => (v.lang||"").toLowerCase().replace("_","-").startsWith(lang)) || null; }catch(e){ return null; }
}
try{ if("speechSynthesis" in window) speechSynthesis.getVoices(); }catch(e){}
function clean(t){ return String(t).replace(/́/g,"").replace(/…/g,"").replace(/ \/ /g,". "); }
function say(text, lang, slow){
  text = clean(text);
  const v = findVoice(lang);
  if(v){
    try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.rate = slow ? 0.6 : 0.9; speechSynthesis.speak(u); return; }catch(e){}
  }
  if(claudeTTS){ claudeTTS.speak(text, {language: lang, rate: slow ? 0.7 : 1}).catch(() => noVoice(lang)); return; }
  noVoice(lang);
}
function noVoice(lang){
  toast(lang === "kk" ? "This device has no Kazakh voice. Tap \"Hear it on Google Translate\" instead." : "This device has no Russian voice. Add one in your phone's text-to-speech settings.");
}

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
let toastT;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 3400); }
const learned = c => (state.cards[c.id]?.box || 0) >= 3;
const isDue = c => state.cards[c.id] && state.cards[c.id].due <= day();
const normText = s => clean(s).toLowerCase().replace(/ё/g,"е").replace(/[.,!?;:«»"()\-–—…\/]/g," ").replace(/\s+/g," ").trim();
const tokens = kk => clean(kk).replace(/[.!?,]/g,"").split(/\s+/).filter(Boolean);

function kbStrip(targetId){

}
function wireKb(){
  $$("[data-ins]").forEach(b => {
    b.onpointerdown = e => e.preventDefault();
    b.onclick = () => {
      const el = document.getElementById(b.dataset.for); if(!el) return;
      const s = el.selectionStart ?? el.value.length, e2 = el.selectionEnd ?? el.value.length;
      el.setRangeText(b.dataset.ins, s, e2, "end");
      el.dispatchEvent(new Event("input", {bubbles:true}));
      el.focus();
    };
  });
}
function addMine(w){
  if(!w || !w.kk) return false;
  if(cards().some(c => normText(c.kk) === normText(w.kk))) { toast("Already in your cards: " + w.kk); return false; }
  state.mine.push({id:"mine:" + Date.now().toString(36) + Math.random().toString(36).slice(2,5), deck:"mine", kk:w.kk.trim(), ru:(w.ru||"").trim(), en:(w.en||"").trim(), hint:(w.hint||"").trim(), note:(w.note||"").trim()});
  save(); toast("Added to My words: " + w.kk);
  return true;

function srs(c, ok, strong){
  const st = state.cards[c.id];
  if(ok){
    if(!st || st.box === 0) state.cards[c.id] = {box:1, due:day(1)};
    else if(strong || st.due <= day()){ const box = Math.min(st.box + 1, INTERVALS.length-1); state.cards[c.id] = {box, due:day(INTERVALS[box])}; }
  }else{
    state.cards[c.id] = {box:0, due:day()};
  }
}

function drawRoad(){
  const road = $("#road"); if(!road) return;
  const nodes = [...road.querySelectorAll(".node")]; if(nodes.length < 2) return;
  const rb = road.getBoundingClientRect();
  const pts = nodes.map(n => { const r = n.getBoundingClientRect(); return [r.left - rb.left + r.width/2, r.top - rb.top + r.height/2]; });
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){ const [x0,y0] = pts[i-1], [x1,y1] = pts[i], my = (y0+y1)/2; d += ` C${x0},${my} ${x1},${my} ${x1},${y1}`; }
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","path"); svg.setAttribute("aria-hidden","true");
  svg.innerHTML = `<path d="${d}"/>`;
  road.prepend(svg);
}

     <div class="grade"><button class="btn ghost" id="fc">Flashcards</button><button class="btn ghost" id="qz">Quiz</button></div>
   </div>`;
  $("#bk").onclick = () => { citySel = null; render(); };
  $("#go").onclick = () => startLesson(j.deck);
  $("#fc").onclick = () => { citySel = null; startSession(j.deck); };
  $("#qz").onclick = () => { citySel = null; quizDeck = j.deck; quizRun = null; buildRun = null; go("quiz"); };
}

/* ================= LESSON ENGINE ================= */
function startLesson(deckId){
  const d = deckById(deckId), cs = d.cards;
  const fresh = cs.filter(c => !state.cards[c.id] || (state.cards[c.id].box === 0 && !state.cards[c.id].seen)).slice(0, 4);
  const others = shuffle(cs.filter(c => !fresh.includes(c) && state.cards[c.id])).sort((a,b) => (state.cards[a.id].box) - (state.cards[b.id].box));
  const targets = fresh.concat(others.slice(0, Math.max(2, 7 - fresh.length)));
  const steps = [];
  fresh.forEach(c => steps.push({t:"intro", c}));
  const tests = targets.map((c, i) => {
    const canBuild = !c.kk.includes("/") && tokens(c.kk).length >= 3 && (c.ru || c.en);
    const kinds = canBuild ? ["build","mc-kk","mc-ru"] : ["mc-kk","mc-ru"];
    return {t: kinds[i % kinds.length], c};
  });
  steps.push(...shuffle(tests));
  const pairPool = cs.filter(c => state.cards[c.id] || fresh.includes(c));
  if(pairPool.length >= 4) steps.splice(Math.min(steps.length, fresh.length + 3), 0, {t:"match", cs: shuffle(pairPool).slice(0, 5)});
  lesson = {deckId, steps, i:0, xp:0, combo:0, bestCombo:0, right:0, total:0, retried:new Set(), done:null,
            L0: levelInfo(state.xp).L, star0: stars(deckId)};
  citySel = null;
  if(tab !== "home") go("home"); else { render(); window.scrollTo(0,0); }
}
function comboMult(){ return lesson.combo >= 10 ? 2 : lesson.combo >= 5 ? 1.5 : 1; }
function lessonAnswer(ok, c, baseXP, rightAnswerHtml){
  const L = lesson; L.total++;
  let gain = 0;
  if(ok){ L.right++; L.combo++; L.bestCombo = Math.max(L.bestCombo, L.combo); gain = Math.round(baseXP * comboMult()); beep("ok"); }
  else { L.combo = 0; gain = 0; beep("bad");
    if(c && !L.retried.has(c.id)){ L.retried.add(c.id); L.steps.push(Object.assign({}, L.steps[L.i], {opts:null, bank:null, placed:null, picked:null, retry:true})); } }
  if(c) srs(c, ok);
  if(gain){ L.xp += gain; addXP(gain, true); }
  save();
  L.done = {ok, gain};
  showFeedback(ok, gain, rightAnswerHtml, c);
}
function showFeedback(ok, gain, rightHtml, c){
  const fb = $("#feedback");
  fb.className = "feedback " + (ok ? "ok" : "no"); fb.hidden = false;
  fb.innerHTML = `<div class="in">
    <div class="row" style="justify-content:space-between"><span class="msg">${ok ? esc(pick(CHEER_OK)) + (gain ? ` +${gain} XP` : "") : "Not quite"}</span>
      ${c ? `<button class="speak" id="fbSay">${ICON}Listen</button>` : ""}</div>
    ${!ok && rightHtml ? `<div>Answer: <span class="ans">${rightHtml}</span></div>` : ""}
    ${ok && c && c.hint && state.settings.hints ? `<div class="small muted">${esc(c.kk)} · ${esc(c.hint)}</div>` : ""}
    <button class="btn ${ok ? "good" : "bad"} block" id="fbNext">Continue</button></div>`;
  if($("#fbSay")) $("#fbSay").onclick = () => say(c.kk, "kk", false);
  $("#fbNext").onclick = nextStep;
  $("#fbNext").focus();
  const cb = $(".combo"); if(cb){ cb.textContent = lesson.combo >= 2 ? `Combo ${lesson.combo}` + (comboMult() > 1 ? ` ×${comboMult()}` : "") : ""; if(ok && lesson.combo >= 2) { cb.classList.remove("hot"); void cb.offsetWidth; cb.classList.add("hot"); } }
}
function hideFeedback(){ const fb = $("#feedback"); if(fb){ fb.hidden = true; fb.innerHTML = ""; } }
function nextStep(){ hideFeedback(); lesson.done = null; lesson.i++; render(); window.scrollTo(0,0); }
function quitLesson(){
  modal(`<h2>Leave this lesson?</h2><p class="muted">You keep the XP you've earned so far.</p>
    <button class="btn block" id="stay">Keep going</button><button class="btn ghost block" id="leave">Leave</button>`, () => {
    $("#stay").onclick = () => $("#modal").classList.remove("on");
    $("#leave").onclick = () => { $("#modal").classList.remove("on"); lesson = null; render(); flush(); };
  });
}
function lessonView(){
  const L = lesson;
  if(L.i >= L.steps.length) return lessonEnd();
  const s = L.steps[L.i];
  const top = `<div class="ltop"><button class="x" id="lx" aria-label="Leave lesson">×</button>
     <div class="lbar" role="progressbar" aria-valuenow="${L.i}" aria-valuemax="${L.steps.length}"><i style="width:${Math.round(100*L.i/L.steps.length)}%"></i></div>
     <span class="combo">${L.combo >= 2 ? `Combo ${L.combo}${comboMult() > 1 ? ` ×${comboMult()}` : ""}` : ""}</span></div>`;
  let body = "";
  const c = s.c;
  if(s.t === "intro"){
    body = `<div class="ask">New word</div>
      <div class="card" style="cursor:default">
        <div class="big">${esc(c.kk)}</div>
        ${state.settings.hints && c.hint ? `<div class="hint">${esc(c.hint)}</div>` : ""}
        ${c.ru ? `<div class="ru">${esc(c.ru)}</div>` : ""}${c.en ? `<div class="en">${esc(c.en)}</div>` : ""}
        ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}
      </div>
      <div class="row" style="justify-content:center"><button class="speak" id="say">${ICON}Listen</button><button class="speak" id="slow">${ICON}Slowly</button><a class="small" href="${gt(c.kk)}" target="_blank" rel="noopener">Google Translate</a></div>
      <button class="btn block" id="gotit">Got it</button>`;
  }else if(s.t === "mc-kk" || s.t === "mc-ru"){
    if(!s.opts){
      const pool = deckById(L.deckId).cards.length >= 4 ? deckById(L.deckId).cards : cards();
      s.opts = shuffle([c].concat(shuffle(pool.filter(o => o.id !== c.id && o.kk !== c.kk && meaning(o) !== meaning(c))).slice(0,3)));
    }
    const kk = s.t === "mc-kk";
    body = kk
      ? `<div class="ask">What does this mean?</div><div class="prompt">${esc(c.kk)}</div><div class="row" style="justify-content:center"><button class="speak" id="say">${ICON}Listen</button></div>`
      : `<div class="ask">Choose the Kazakh</div><div class="prompt" style="font-size:24px">${esc(c.ru || c.en)}</div>${c.ru && c.en ? `<div class="muted" style="text-align:center">${esc(c.en)}</div>` : ""}`;
    body += `<div class="stack">${s.opts.map((o,k) => {
      let cls = "opt"; if(L.done){ if(o.id === c.id) cls += " right"; else if(k === s.picked) cls += " wrong"; }
      return `<button class="${cls}" data-o="${k}" ${L.done ? "disabled" : ""}>${kk ? `${esc(meaning(o))}${o.en && o.ru ? `<small>${esc(o.ru)}</small>` : ""}` : `<span class="kk">${esc(o.kk)}</span>`}</button>`; }).join("")}</div>`;
  }else if(s.t === "build"){
    if(!s.bank){ s.bank = shuffle(tokens(c.kk).map((w,k) => ({w,k}))); s.placed = []; }
    body = `<div class="ask">Build the sentence</div><div class="prompt" style="font-size:22px">${esc(c.ru || c.en)}</div>${c.ru && c.en ? `<div class="muted" style="text-align:center">${esc(c.en)}</div>` : ""}
      <div class="slot" aria-label="Your sentence">${s.placed.length ? s.placed.map((t,k) => `<button class="chip wordchip" data-un="${k}" ${L.done ? "disabled" : ""}>${esc(t.w)}</button>`).join("") : `<span class="small muted">Tap the words in order.</span>`}</div>
      <div class="chips" style="justify-content:center">${s.bank.map((t,k) => `<button class="chip wordchip" data-pk="${k}" ${L.done ? "disabled" : ""}>${esc(t.w)}</button>`).join("")}</div>
      ${L.done ? "" : `<button class="btn block" id="check" ${s.bank.length ? "disabled" : ""}>Check</button>`}`;
  }else if(s.t === "match"){
    if(!s.left){ s.left = shuffle(s.cs.map(x => x.id)); s.right = shuffle(s.cs.map(x => x.id)); s.gone = []; s.sel = null; s.miss = 0; }
    const byId = id => s.cs.find(x => x.id === id);
    body = `<div class="ask">Match the pairs</div>
      <div class="match">
        <div class="stack">${s.left.map(id => `<button class="tile kk ${s.gone.includes(id) ? "gone" : ""} ${s.sel && s.sel.side==="l" && s.sel.id===id ? "sel" : ""}" data-l="${id}">${esc(byId(id).kk)}</button>`).join("")}</div>
        <div class="stack">${s.right.map(id => `<button class="tile ${s.gone.includes(id) ? "gone" : ""} ${s.sel && s.sel.side==="r" && s.sel.id===id ? "sel" : ""}" data-r="${id}">${esc(meaning(byId(id)))}</button>`).join("")}</div>
      </div>`;
  }
  $("#view").innerHTML = top + body;
  $("#lx").onclick = quitLesson;
  if($("#say")) $("#say").onclick = () => say(c.kk, "kk", false);
  if($("#slow")) $("#slow").onclick = () => say(c.kk, "kk", true);
  if(s.t === "intro"){
    $("#gotit").onclick = () => { if(!state.cards[c.id]) state.cards[c.id] = {box:0, due:day()}; state.cards[c.id].seen = true; save(); nextStep(); };
  }
  if(s.t === "mc-kk" || s.t === "mc-ru"){
    $$("[data-o]").forEach(b => b.onclick = () => {
      if(L.done) return;
      s.picked = +b.dataset.o;
      const ok = s.opts[s.picked].id === c.id;
      lessonAnswer(ok, c, XP.card, esc(s.t === "mc-kk" ? meaning(c) : c.kk));
      lessonView();
    });
    if(s.t === "mc-kk" && !L.done && !s.spoken){ s.spoken = true; }
  }
  if(s.t === "build"){
    $$("[data-pk]").forEach(b => b.onclick = () => { s.placed.push(s.bank.splice(+b.dataset.pk,1)[0]); beep("tick"); lessonView(); });
    $$("[data-un]").forEach(b => b.onclick = () => { s.bank.push(s.placed.splice(+b.dataset.un,1)[0]); lessonView(); });
    if($("#check")) $("#check").onclick = () => {
      const ok = s.placed.map(t => t.w).join(" ") === tokens(c.kk).join(" ");
      lessonAnswer(ok, c, XP.build, esc(c.kk)); lessonView();
    };
  }
  if(s.t === "match"){
    const tap = (side, id, el) => {
      if(s.gone.includes(id)) return;
      if(!s.sel || s.sel.side === side){ s.sel = {side, id}; lessonView(); return; }
      if(s.sel.id === id){
        s.gone.push(id); s.sel = null; beep("pair");
        const cc = s.cs.find(x => x.id === id); srs(cc, true);
        if(s.gone.length === s.cs.length){
          const perfect = s.miss === 0;
          L.total++; if(perfect){ L.right++; L.combo++; L.bestCombo = Math.max(L.bestCombo, L.combo); } else L.combo = 0;

          lessonView(); showFeedback(true, gain, "", null);

        }

      }else{
        s.miss++; L.combo = 0; beep("bad");
        const other = s.sel; s.sel = null; lessonView();
        const a = document.querySelector(`[data-${side === "l" ? "l" : "r"}="${id}"]`), b2 = document.querySelector(`[data-${other.side}="${other.id}"]`);
        [a,b2].forEach(x => x && x.classList.add("shake"));
      }
    };
    $$("[data-l]").forEach(b => b.onclick = () => tap("l", b.dataset.l, b));
    $$("[data-r]").forEach(b => b.onclick = () => tap("r", b.dataset.r, b));
  }
}
function lessonEnd(){
  const L = lesson;
  if(!L.finished){
    L.finished = true;
    const acc = L.total ? L.right / L.total : 1;
    L.bonus = XP.lessonDone + (acc === 1 && L.total >= 3 ? XP.perfect : 0);
    L.xp += L.bonus;
    state.lessons = (state.lessons||0) + 1;
    state.bestCombo = Math.max(state.bestCombo||0, L.bestCombo);
    addXP(L.bonus, true);
    L.star1 = stars(L.deckId);
    if(L.star1 > L.star0){ beep("level"); confetti(); }
    const idx = JOURNEY.findIndex(j => j.deck === L.deckId);
    L.unlockedNext = L.star0 < 1 && L.star1 >= 1 && idx >= 0 && idx < JOURNEY.length - 1 ? JOURNEY[idx+1].city : null;
  }
  const acc = L.total ? Math.round(100 * L.right / L.total) : 100;
  const j = JOURNEY.find(x => x.deck === L.deckId);
  $("#view").innerHTML = `<div class="result">
    <div class="flag">${esc(j ? j.city : deckById(L.deckId).title)} · Lesson complete</div>
    <div class="big">+${L.xp} XP</div>
    <h2>${acc === 100 ? "Мінсіз! Perfect lesson" : acc >= 80 ? "Жарайсың! Great work" : "Good effort. Practice makes it stick"}</h2>
    <div class="stats">
      <div class="stat"><b>${acc}%</b><span>accuracy</span></div>
      <div class="stat"><b>${L.bestCombo}</b><span>best combo</span></div>
      <div class="stat"><b>${starStr(L.star1)}</b><span>stars here</span></div>
    </div>
    ${L.bonus > XP.lessonDone ? `<div class="tip" style="width:100%">No mistakes: +${XP.perfect} XP bonus.</div>` : ""}
    ${L.star1 > L.star0 ? `<div class="tip" style="width:100%">New star in ${esc(j ? j.city : "this deck")}!${L.unlockedNext ? ` <b>${esc(L.unlockedNext)}</b> is now unlocked.` : ""}</div>` : ""}
    <button class="btn gold block" id="again">Another lesson here</button>
    <button class="btn block" id="map">Back to the journey</button>
  </div>`;
  $("#again").onclick = () => startLesson(L.deckId);
  $("#map").onclick = () => { lesson = null; render(); window.scrollTo(0,0); };
  setTimeout(flush, 600);

/* ================= REVIEW (flashcards) ================= */
let session = null;
function startSession(deckId){
  const pool = deckId ? (deckById(deckId)?.cards || []) : cards();
  const due = shuffle(pool.filter(isDue));
  const fresh = pool.filter(c => !state.cards[c.id]).slice(0, state.settings.newPer);
  let queue = due.concat(fresh);
  if(!queue.length) queue = shuffle(pool).sort((a,b) => (state.cards[a.id]?.box||0) - (state.cards[b.id]?.box||0)).slice(0, 10);
  session = {deckId, queue, i:0, flipped:false, again:{}, right:0, total:queue.length, xp:0};
  go("learn");
}
function learn(){
  if(!session){
    const due = cards().filter(isDue).length;
    $("#view").innerHTML = `<h2>Review</h2>
     <p class="muted">Words come back right before you'd forget them. Reviewing is how cities earn ★★ and ★★★.</p>
     <button class="btn gold block" id="s-all">${due ? `Review ${due} due card${due>1?"s":""}` : "Mixed practice"} · +XP</button>
     <h3>Or pick a deck</h3>
     <div class="stack">${decks().map(d => `<button class="btn ghost block" data-study="${d.id}">${esc(d.title)} · ${esc(d.sub)}</button>`).join("")}</div>`;
    $("#s-all").onclick = () => startSession(null);
    $$("[data-study]").forEach(b => b.onclick = () => startSession(b.dataset.study));
    return;
  }
  if(!session.queue.length){
    $("#view").innerHTML = `<h2>No cards here yet</h2><p class="muted">Add words in More → My words, or pick another deck.</p><button class="btn block" id="home">Back</button>`;
    $("#home").onclick = () => { session = null; render(); };
    return;
  }
  if(session.i >= session.queue.length){
    $("#view").innerHTML = `<div class="result"><div class="flag">Review done</div><div class="big">+${session.xp} XP</div>
     <p>You knew <b>${session.right}</b> of ${session.total} cards on the first try.</p>
     <div class="tip" style="width:100%">Now use them: a two-minute chat with the AI partner makes words stick far better than another round.</div>
     <button class="btn gold block" id="talk">Practise in a conversation</button>
     <button class="btn ghost block" id="again">Another round</button>
     <button class="linkish" id="home">Done</button></div>`;
    $("#talk").onclick = () => { session = null; go("talk"); };
    $("#again").onclick = () => startSession(session.deckId);
    $("#home").onclick = () => { session = null; go("home"); };
    return;
  }
  const c = session.queue[session.i];
  const box = state.cards[c.id]?.box || 0, reverse = box >= 2, isNew = !state.cards[c.id];
  const front = reverse
    ? `<div class="label">Say it in Kazakh</div><div class="big" style="font-size:26px">${esc(c.ru || c.en)}</div><div class="en">${esc(c.ru ? c.en : "")}</div>`
    : `<div class="label">${isNew ? "New card" : "What does this mean?"}</div><div class="big">${esc(c.kk)}</div>`;
  const back = `<div class="big">${esc(c.kk)}</div>
     ${state.settings.hints && c.hint ? `<div class="hint">${esc(c.hint)}</div>` : ""}
     ${c.ru ? `<div class="ru">${esc(c.ru)}</div>` : ""}${c.en ? `<div class="en">${esc(c.en)}</div>` : ""}
     ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}`;
  const dname = session.deckId ? (deckById(session.deckId)?.title || "") : "Mixed review";
  $("#view").innerHTML = `
   <div class="progress"><span>${esc(dname)} · +${session.xp} XP</span><span>${session.i+1} / ${session.queue.length}</span></div>
   <div class="card" id="card" role="button" tabindex="0" aria-label="Flip card">${session.flipped ? back : front}
     ${session.flipped ? "" : `<div class="small muted" style="margin-top:14px">Tap to see the answer</div>`}</div>
   <div class="row" style="justify-content:center">
     <button class="speak" id="play">${ICON}Listen</button><button class="speak" id="slow">${ICON}Slowly</button>
     <a class="small" href="${gt(c.kk)}" target="_blank" rel="noopener">Hear it on Google Translate</a></div>
   ${session.flipped ? `<div class="grade"><button class="btn bad" id="no">Didn't know</button><button class="btn good" id="yes">Knew it</button></div>` : `<button class="btn block" id="flip">Show answer</button>`}
   <button class="linkish" id="quit">End review</button>`;
  const flip = () => { session.flipped = true; learn(); };
  $("#card").onclick = () => { if(!session.flipped) flip(); };
  $("#card").onkeydown = e => { if((e.key==="Enter"||e.key===" ") && !session.flipped){ e.preventDefault(); flip(); } };
  $("#play").onclick = () => say(c.kk, "kk", false);
  $("#slow").onclick = () => say(c.kk, "kk", true);
  $("#quit").onclick = () => { session.i = session.queue.length; learn(); };
  if(!session.flipped){ $("#flip").onclick = flip; return; }
  $("#yes").onclick = () => grade(c, true);
  $("#no").onclick = () => grade(c, false);
}
function grade(c, ok){
  const prev = state.cards[c.id] || {box:0};
  const firstTry = !session.again[c.id];
  if(ok){
    const box = firstTry ? Math.min(prev.box + 1, INTERVALS.length-1) : Math.max(prev.box, 1);
    state.cards[c.id] = {box, due: day(INTERVALS[box]), seen:true};
    if(firstTry) session.right++;
    beep("ok");
  }else{
    state.cards[c.id] = {box:0, due: day(), seen:true};
    if((session.again[c.id]||0) < 2){ session.again[c.id] = (session.again[c.id]||0) + 1; session.queue.push(c); }
  }
  const g = ok ? (firstTry ? XP.card : 4) : XP.cardMiss;
  session.xp += g;
  session.i++; session.flipped = false;
  addXP(g);
  learn();
}

/* ================= TALK (AI partner) ================= */
let talkS = null;
function knownWords(){ return cards().filter(c => state.cards[c.id]).map(c => c.kk.replace(/[!?.]/g,"")).slice(0, 80).join(", "); }
function scenePrompt(sc){
  const kk = sc.lang === "kk";
  const explain = state.settings.explain === "en" ? "English" : "Russian";
  return [
   `You are a conversation partner in a language-learning app. The learner is a 19-year-old Kazakh man who grew up abroad. His Kazakh is beginner level (he knows numbers and some phrases). His Russian is about B2 with a strong American accent. He is practising ${kk ? "KAZAKH" : "RUSSIAN"}.`,
   `Scene: ${sc.setup}`,
   `You play: ${sc.role}. Stay in character and keep the scene moving with a question or a prompt he can answer.`,

      : `Write your reply in natural spoken Russian, 1–3 sentences, B1–B2 level. Put a stress mark (combining acute accent U+0301) after the stressed vowel of every word with two or more syllables, e.g. «хорошо́», «спаси́бо».`,
   `He may write in ${kk ? "Kazakh, Russian or English. If he writes in Russian or English, put the Kazakh way to say it in correction.fixed" : "Russian or English. If he writes in English, put the Russian way to say it in correction.fixed"}. Check his last message for real mistakes (grammar, endings, word choice, ${kk ? "Kazakh letters ә ғ қ ң ө ұ ү һ і, Сіз vs сен with elders" : "cases, aspect, gender"}). Ignore punctuation and capital letters. Be warm and brief.`,
   `Respond with ONLY a JSON object, no markdown, in exactly this shape:`,
   `{"correction":{"ok":true,"fixed":"","explain":""},"reply":"","pron":"","ru":"","en":"","suggestions":[{"text":"","en":""}],"new_words":[{"kk":"","ru":"","en":""}]}`,
   `- correction.ok: true if his message was correct or there is no message yet. Otherwise false, with fixed = the corrected ${kk ? "Kazakh" : "Russian"} sentence and explain = one short sentence in ${explain} saying what changed.`,
   kk ? `- pron: Latin-letter pronunciation of your reply (ä ö ü ı q ğ ñ for the Kazakh sounds).` : `- pron: empty string.`,
   kk ? `- ru: Russian translation of your reply. en: English translation.` : `- ru: empty string. en: English translation of your reply.`,
   `- suggestions: exactly 3 short, simple answers he could give next, in ${kk ? "Kazakh" : "Russian"}${kk ? "" : " with stress marks"}, each with its English meaning.`,
   kk ? `- new_words: up to 3 useful words or phrases from your reply that a beginner may not know (kk, ru, en). Empty array if none.` : `- new_words: empty array.`
  ].join("\n");
}
function startScene(sc){
  talkS = {scene:sc, msgs:[{role:"user", content: scenePrompt(sc) + "\n\nThere is no message from him yet. Start the scene with your first line."}], turns:[], busy:false, err:null, draft:""};
  render(); requestReply();
}
async function requestReply(){
  const t = talkS; if(!t) return;
  t.busy = true; t.err = null; render();
  try{
    const res = await askJSON(t.msgs.slice(0,1).concat(t.msgs.slice(1).slice(-18)));
    if(talkS !== t) return;
    if(!res || typeof res.reply !== "string" || !res.reply.trim()) throw {code:"bad_json"};
    const lastMe = [...t.turns].reverse().find(x => x.who === "me");
    if(lastMe && !lastMe.correction && res.correction){
      lastMe.correction = res.correction;
      if(res.correction.ok){ addXP(XP.talkOk); beep("ok"); }
    }
    t.msgs.push({role:"assistant", content: JSON.stringify(res)});
    t.turns.push({who:"ai", data:res, show:false});
  }catch(e){ if(talkS !== t) return; t.err = aiError(e); }
  t.busy = false; render();
  setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30);
}
function sendTalk(text){
  const t = talkS; text = (text||"").trim();
  if(!t || !text || t.busy) return;
  t.turns.push({who:"me", text});
  t.msgs.push({role:"user", content: `His message: «${text}»\nRespond with the JSON object only.`});
  t.draft = "";
  addXP(XP.talk);
  requestReply();
}
function talk(){
  if(!talkS){
    const avail = sampleState === "ready";
    const scene = sc => `<button class="chip" data-scene="${sc.id}" ${avail ? "" : "disabled"}><b>${esc(sc.title)}</b><small>${esc(sc.sub)}</small></button>`;
    $("#view").innerHTML = `<h2>Talk</h2>
     <p class="muted">Pick a scene. Your partner answers in simple Kazakh or Russian, fixes your mistakes, and suggests what you could say next. Stuck? Write in Russian or English and it will show you how to say it. <b>+${XP.talk} XP</b> per message, <b>+${XP.talkOk}</b> more when it's correct.</p>
     ${sampleState === "loading" ? `<p class="small muted">Connecting to the AI partner…</p>` : ""}
     ${sampleState === "none" ? `<div class="tip">The AI partner works when this page is open inside Claude while you're signed in. Everything else in the app works without it.</div>` : ""}
     <h3>Kazakh</h3><div class="sugg">${SCENES.filter(s => s.lang==="kk").map(scene).join("")}</div>
     <h3>Russian</h3><div class="sugg">${SCENES.filter(s => s.lang==="ru").map(scene).join("")}</div>
     <p class="small muted">Uses your Claude plan's normal usage. No API key or separate bill.</p>`;
    $$("[data-scene]").forEach(b => b.onclick = () => startScene(SCENES.find(s => s.id === b.dataset.scene)));
    return;
  }
  const t = talkS, sc = t.scene, kk = sc.lang === "kk";
  const lastAi = [...t.turns].reverse().find(x => x.who === "ai");
  const html = t.turns.map((x, i) => {
    if(x.who === "me"){
      const c = x.correction;
      const fix = !c ? "" : c.ok ? `<div class="fix ok">Correct. +${XP.talkOk} XP</div>`
        : `<div class="fix">Better: <b>${esc(c.fixed)}</b>${c.explain ? `<br>${esc(c.explain)}` : ""}${kk && c.fixed ? `<br><button class="linkish" data-savefix="${i}">${x.saved ? "Saved to My words" : "+ Save as a card"}</button>` : ""}</div>`;
      return `<div class="bub me">${esc(x.text)}</div>${fix}`;
    }
    const d = x.data, words = (d.new_words || []).filter(w => w && w.kk);
    return `<div class="bub ai">
      <div class="tgt">${esc(d.reply)}</div>
      ${kk && state.settings.hints && d.pron ? `<div class="pr">${esc(d.pron)}</div>` : ""}
      ${x.show ? `${d.ru ? `<div class="tr2">${esc(d.ru)}</div>` : ""}<div class="tr2">${esc(d.en)}</div>` : ""}
      <div class="row"><button class="speak" data-say="${i}">${ICON}Listen</button><button class="linkish" data-tr="${i}">${x.show ? "Hide translation" : "Translate"}</button></div>
      ${x.show && words.length ? `<div class="chips">${words.map((w,k) => `<button class="chip" data-add="${i}.${k}">+ ${esc(w.kk)} <span class="muted">${esc(w.en || w.ru)}</span></button>`).join("")}</div>` : ""}
    </div>`;
  }).join("");
  const sugg = (!t.busy && lastAi && lastAi.data.suggestions) ? lastAi.data.suggestions.filter(s => s && s.text).slice(0,3) : [];
  $("#view").innerHTML = `
   <div class="row" style="justify-content:space-between"><button class="back" id="leave">‹ Scenes</button><span class="small muted">${esc(sc.title)} · ${kk ? "Kazakh" : "Russian"}</span></div>
   <div class="chat">${html}
     ${t.busy ? `<div class="typing">${kk ? "жазып жатыр…" : "печатает…"}</div>` : ""}
     ${t.err ? `<div class="err">${esc(t.err)} <button class="linkish" id="retry">Retry</button></div>` : ""}</div>
   ${sugg.length ? `<div class="sugg"><span class="small muted">Ideas (tap to use):</span>${sugg.map((s,k) => `<button class="chip" data-sg="${k}">${esc(s.text)}<small>${esc(s.en)}</small></button>`).join("")}</div>` : ""}
   <div class="compose">
     ${kk ? kbStrip("msg") : ""}
     <div class="in">
       <textarea id="msg" rows="1" placeholder="${kk ? "Жазыңыз… (or write in Russian/English)" : "Напиши́те… (or write in English)"}" aria-label="Your message">${esc(t.draft)}</textarea>
       ${dict && !dictDenied ? `<button class="speak" id="mic" aria-label="Speak instead of typing">${MIC}</button>` : ""}
       <button class="btn" id="send" ${t.busy ? "disabled" : ""}>Send</button>
     </div></div>`;
  $("#leave").onclick = () => { talkS = null; render(); };
  const ta = $("#msg");
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; };
  ta.oninput = () => { t.draft = ta.value; grow(); };
  ta.onkeydown = e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendTalk(ta.value); } };
  grow();
  $("#send").onclick = () => sendTalk(ta.value);
  if(kk) wireKb();
  if($("#retry")) $("#retry").onclick = requestReply;
  $$("[data-say]").forEach(b => b.onclick = () => say(t.turns[+b.dataset.say].data.reply, sc.lang, false));
  $$("[data-tr]").forEach(b => b.onclick = () => { const x = t.turns[+b.dataset.tr]; x.show = !x.show; render(); });
  $$("[data-add]").forEach(b => b.onclick = () => { const [i,k] = b.dataset.add.split(".").map(Number); addMine(t.turns[i].data.new_words[k]); });
  $$("[data-savefix]").forEach(b => b.onclick = () => {
    const x = t.turns[+b.dataset.savefix]; if(x.saved) return;
    if(addMine({kk:x.correction.fixed, en:"You wrote: " + x.text, note:x.correction.explain || ""})){ x.saved = true; render(); }
  });
  $$("[data-sg]").forEach(b => b.onclick = () => { t.draft = sugg[+b.dataset.sg].text; ta.value = t.draft; grow(); ta.focus(); });
  const mic = $("#mic");
  if(mic){
    let listening = false, base = "";
    mic.onclick = () => {
      if(listening){ stopDictation(); return; }
      base = ta.value ? ta.value.replace(/\s*$/," ") : "";
      const ok = startDictation({
        partial: txt => { ta.value = base + txt; },
        final: txt => { base = base + txt + " "; ta.value = base; t.draft = ta.value; grow(); },
        state: s => { listening = s === "listening"; mic.classList.toggle("on", listening); }
      });
      if(!ok) toast("Speech input isn't available here. You can keep typing.");
    };
  }
}

/* ================= PRACTICE (quiz + build) ================= */
let quizDeck = "all", quizRun = null, quizMode = "mc", buildRun = null;
const buildable = pool => pool.filter(c => !c.kk.includes("/") && tokens(c.kk).length >= 3 && (c.ru || c.en));
function startQuiz(pool){
  quizRun = {qs: shuffle(shuffle(pool).slice(0,10).map((c,i) => ({c, dir: i%2 ? "ru" : "kk"}))), i:0, score:0, picked:null, xp:0};
  quiz();
}
function startBuild(pool){
  const own = shuffle(buildable(pool)), ownIds = new Set(own.map(c => c.id));
  const src = own.concat(shuffle(buildable(cards()).filter(c => !ownIds.has(c.id)))).slice(0, 8);
  buildRun = {qs: src.map(c => ({c, bank: shuffle(tokens(c.kk).map((w,k) => ({w,k}))), placed:[], checked:null})), i:0, score:0, xp:0};
  quiz();
}
function build(){
  const r = buildRun, pool = quizDeck === "all" ? cards() : (deckById(quizDeck)?.cards || []);
  if(r.i >= r.qs.length){
    $("#view").innerHTML = `<div class="result"><div class="flag">Build the sentence</div><div class="big">+${r.xp} XP</div><h2>${r.score}/${r.qs.length} sentences</h2>
     <p>${r.score >= r.qs.length-1 ? "Керемет! Your word order is solid." : "Remember: the verb goes last. Try another round."}</p>
     <button class="btn gold block" id="again">Another round</button><button class="btn ghost block" id="back">Back to Practice</button></div>`;
    $("#again").onclick = () => startBuild(pool);
    $("#back").onclick = () => { buildRun = null; quiz(); };
    return;
  }
  const q = r.qs[r.i], answer = tokens(q.c.kk).join(" ");
  $("#view").innerHTML = `
   <div class="progress"><span>Build the sentence · +${r.xp} XP</span><span>${r.i+1} / ${r.qs.length}</span></div>
   <div class="prompt" style="font-size:22px">${esc(q.c.ru || q.c.en)}</div><div class="muted" style="text-align:center">${esc(q.c.ru ? q.c.en : "")}</div>
   <div class="slot">${q.placed.length ? q.placed.map((t,k) => `<button class="chip wordchip" data-un="${k}">${esc(t.w)}</button>`).join("") : `<span class="small muted">Tap the words below in the right order.</span>`}</div>
   <div class="chips" style="justify-content:center">${q.bank.map((t,k) => `<button class="chip wordchip" data-pk="${k}">${esc(t.w)}</button>`).join("")}</div>
   ${q.checked == null ? `<button class="btn block" id="check" ${q.bank.length ? "disabled" : ""}>Check</button>`
     : `<div class="fix ${q.checked ? "ok" : ""}" style="align-self:stretch;max-width:none">${q.checked ? `Correct! +${XP.build} XP` : `Correct order: <b>${esc(q.c.kk)}</b>`}${q.c.hint && state.settings.hints ? `<br><span class="small">${esc(q.c.hint)}</span>` : ""}</div>
        <div class="row"><button class="speak" id="play">${ICON}Listen</button></div><button class="btn block" id="next">Next</button>`}
   <button class="linkish" id="quitb">End drill</button>`;
  $$("[data-pk]").forEach(b => b.onclick = () => { if(q.checked != null) return; q.placed.push(q.bank.splice(+b.dataset.pk,1)[0]); build(); });
  $$("[data-un]").forEach(b => b.onclick = () => { if(q.checked != null) return; q.bank.push(q.placed.splice(+b.dataset.un,1)[0]); build(); });
  if($("#check")) $("#check").onclick = () => { q.checked = q.placed.map(t => t.w).join(" ") === answer; if(q.checked){ r.score++; r.xp += XP.build; addXP(XP.build); beep("ok"); } else beep("bad"); build(); };
  if($("#play")) $("#play").onclick = () => say(q.c.kk, "kk", false);
  if($("#next")) $("#next").onclick = () => { r.i++; build(); };
  $("#quitb").onclick = () => { buildRun = null; quiz(); };
}
function quiz(){
  if(buildRun) return build();
  const pool = quizDeck === "all" ? cards() : (deckById(quizDeck)?.cards || []);
  if(!quizRun){
    const best = state.best[quizDeck];
    $("#view").innerHTML = `<h2>Practice</h2>
     <div class="chips" role="group" aria-label="Practice type"><button class="chip" aria-pressed="${quizMode==="mc"}" data-mode="mc">Multiple choice</button><button class="chip" aria-pressed="${quizMode==="build"}" data-mode="build">Build the sentence</button></div>
     <p class="muted">${quizMode === "mc" ? `10 questions, +${XP.card} XP each. Half show Kazakh and ask the meaning; half show Russian and ask for the Kazakh.` : `8 sentences, +${XP.build} XP each. Put the Kazakh words in the right order.`}</p>
     <div class="chips">${[{id:"all",title:"All decks"}].concat(decks()).map(d => `<button class="chip" aria-pressed="${quizDeck===d.id}" data-d="${d.id}">${esc(d.title)}</button>`).join("")}</div>
     ${best != null && quizMode === "mc" ? `<p class="small muted">Your best on this one: ${best}/10</p>` : ""}
     ${quizMode === "mc" && pool.length < 4 ? `<p class="err">This deck needs at least 4 words for a quiz.</p>` : ""}
     <button class="btn gold block" id="go" ${quizMode === "mc" && pool.length < 4 ? "disabled" : ""}>Start</button>`;
    $$("[data-mode]").forEach(b => b.onclick = () => { quizMode = b.dataset.mode; quiz(); });
    $$("[data-d]").forEach(b => b.onclick = () => { quizDeck = b.dataset.d; quiz(); });
    $("#go").onclick = () => quizMode === "build" ? startBuild(pool) : startQuiz(pool);
    return;
  }
  const r = quizRun;
  if(r.i >= r.qs.length){
    const n = r.qs.length, prevBest = state.best[quizDeck] ?? -1;
    if(r.score > prevBest){ state.best[quizDeck] = r.score; save(); }
    $("#view").innerHTML = `<div class="result"><div class="flag">Quiz done</div><div class="big">+${r.xp} XP</div><h2>${r.score}/${n}</h2>
     <p>${r.score >= n-1 ? "Өте жақсы! Very good." : r.score >= n/2 ? "Жақсы. Review the cards you missed, then try again." : "Do a lesson on this deck first, then come back."}</p>
     <button class="btn gold block" id="again">Try again</button><button class="btn ghost block" id="back">Back to Practice</button></div>`;
    $("#again").onclick = () => startQuiz(pool);
    $("#back").onclick = () => { quizRun = null; quiz(); };
    return;
  }
  const q = r.qs[r.i];
  if(!q.opts) q.opts = shuffle([q.c].concat(shuffle((pool.length >= 4 ? pool : cards()).filter(c => c.id !== q.c.id && c.kk !== q.c.kk)).slice(0,3)));
  const prompt = q.dir === "kk"
    ? `<div class="ask">What does this mean?</div><div class="prompt">${esc(q.c.kk)}</div>`
    : `<div class="ask">Choose the Kazakh</div><div class="prompt" style="font-size:24px">${esc(q.c.ru || q.c.en)}</div><div class="muted" style="text-align:center">${esc(q.c.ru ? q.c.en : "")}</div>`;
  $("#view").innerHTML = `
   <div class="progress"><span>Score ${r.score} · +${r.xp} XP</span><span>${r.i+1} / ${r.qs.length}</span></div>
   ${prompt}
   <div class="stack">${q.opts.map((o,k) => {
     let cls = "opt"; if(r.picked != null){ if(o.id === q.c.id) cls += " right"; else if(k === r.picked) cls += " wrong"; }
     const label = q.dir === "kk" ? `${esc(meaning(o))}<small>${esc(o.en ? o.ru : "")}</small>` : `<span class="kk">${esc(o.kk)}</span><small>${esc(state.settings.hints ? o.hint : "")}</small>`;
     return `<button class="${cls}" data-k="${k}">${label}</button>`; }).join("")}</div>
   ${r.picked != null ? `<div class="row"><button class="speak" id="play">${ICON}Listen</button><span class="small muted">${esc(q.c.kk)}${q.c.hint ? " · " + esc(q.c.hint) : ""}</span></div><button class="btn block" id="next">Next</button>` : ""}`;
  $$("[data-k]").forEach(b => b.onclick = () => {
    if(r.picked != null) return;
    r.picked = +b.dataset.k;
    const ok = q.opts[r.picked].id === q.c.id;
    if(ok){ r.score++; r.xp += XP.card; beep("ok"); srs(q.c, true); addXP(XP.card); } else { beep("bad"); srs(q.c, false); save(); }
    quiz();
  });
  if(r.picked != null){
    $("#play").onclick = () => say(q.c.kk, "kk", false);
    $("#next").onclick = () => { r.i++; r.picked = null; quiz(); };
  }
}

let exState = {};
function grammar(){
  $("#view").innerHTML = `${backBtn()}<h2>Grammar in 6 short lessons</h2>
   <p class="muted">Just enough to build your own sentences. Each lesson takes about two minutes. +${XP.gram} XP for each exercise you get right.</p>

     ${L.ex.length ? `<h3>Try it</h3>${L.ex.map((x,k) => {
       const key = L.id + k, pk = exState[key];
       const cut = x.q.indexOf(" ("), kkPart = cut > 0 ? x.q.slice(0, cut) : x.q, enPart = cut > 0 ? x.q.slice(cut + 1) : "";
       const shown = esc(kkPart).replace("__", pk != null ? `<b>${esc(x.o[x.a])}</b>` : "<b>__</b>");
       return `<div class="stack"><div class="ex-q"><span class="kk">${shown}</span> <span class="small muted">${esc(enPart)}</span></div><div class="chips">${x.o.map((o,j) => {
         let st = ""; if(pk != null){ if(j === x.a) st = ' style="border-color:var(--good);color:var(--good);font-weight:700"'; else if(j === pk) st = ' style="border-color:var(--bad);color:var(--bad)"'; }
         return `<button class="chip" data-ex="${key}.${j}"${st}>-${esc(o)}</button>`; }).join("")}</div></div>`; }).join("")}` : ""}
   </section>`).join("")}
   <div class="tip">Put it to work: open Talk and try one sentence from each lesson. The partner will correct the endings for you.</div>`;
  wireBack();
  $$("[data-ex]").forEach(b => b.onclick = () => {
    const v = b.dataset.ex, cut = v.lastIndexOf("."), key = v.slice(0, cut), j = +v.slice(cut+1);
    if(exState[key] != null) return;
    exState[key] = j;
    const L = LESSONS.find(l => key.startsWith(l.id) && /^\d+$/.test(key.slice(l.id.length)));
    const ok = L && L.ex[+key.slice(L.id.length)].a === j;
    if(ok){ beep("ok"); addXP(XP.gram); } else beep("bad");
    const y = window.scrollY; grammar(); window.scrollTo(0, y);
  });
}
